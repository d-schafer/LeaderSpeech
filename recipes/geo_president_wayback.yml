# Georgia — President of Georgia (president.gov.ge). PURE-WAYBACK: the live site is
# geo-fenced (DNS resolves to 91.232.26.11 but there is NO TCP from outside Georgia — the
# pak_pmo / edge-drop pattern), so it cannot be scraped live from here. The Internet Archive
# holds it deeply: the whole host has ~20,000 captures spanning 2006-2025.
#
# SPEECH PATH: the modern site files news/speeches under /en/News/Article/<slug> — the CDX
# shows ~513 distinct article captures (2020-2023, the Zourabichvili presidency).
# LANGUAGE CORRECTION (2026-07-26): despite the /en/ URL, these archived pages serve GEORGIAN, not
# English — a language sample of 8 captures found 0 English chars in .InsideNewsBox on every one, AND
# no English text block anywhere on the page (so it is NOT a selector bug; the English translation
# simply doesn't exist for this era). source_language changed English -> Georgian so map_to_schema
# routes the body to text_originlanguage and the translation stage fills the English `text`. (The OLD
# 2011-2015 /en/PressOffice/News/SpeechesAndStatements scheme IS genuine English — see the separate
# geo_president_english_wayback recipe.)
#
# ── RULE 1 AUDIT 2026-08-13 (chunk A5) — CHECKED CLEAN for its generation, no change made ──────
# cdxbatch on president.gov.ge (--match domain, 19,701 in-scope captures) confirms /en/News/Article
# IS the whole modern flat article namespace: 510 distinct slugs. Everything else on the host is
# either (a) the OLDER /en/PressOffice/News/<Section>?p=<id> generation, which belongs to
# geo_president_english_wayback and was widened there in the same pass (489 -> ~2,243 articles), or
# (b) the other-language trees of THESE SAME articles, measured by slug:
#     /ab/News/Article/  296 slugs — 296 of 296 (100%) also present under /en/  -> pure twins
#     /ru/News/Article/  439 slugs — 431 of 439  (98%)                          -> pure twins
#     /ge/News/Article/  483 slugs — 434 of 483  (90%)                          -> near-pure twins
#     /ka/News/Article/  840 slugs — 470 of 840  (56%)  -> ~370 slugs EXIST ONLY IN /ka/
# So the only real gap on this host is the /ka/ tree, and it is NOT a widening of this recipe:
# adding /ka/ here would re-fetch the 470 shared slugs as duplicate rows (page_identity keeps the
# path). It needs its own sibling — BANKED, not authored, because both trees are Georgian-language
# and therefore parked under the English-first policy anyway, so authoring it now buys nothing that
# a later pass cannot get more cheaply alongside the /ka/ selector work.
# Note the /en/ URL is not a language: this recipe's pages serve GEORGIAN (see below), so a /ka/
# sibling is a coverage gain, not a language gain.
source_id: geo_president_wayback
country: Georgia
source_language: Georgian
start_urls:
  # CDX prefix — engine prefix-matches, so NO trailing '*'.
  - www.president.gov.ge/en/News/Article
renderer: static

listing:
  # Exclude the ~/getattachment/… .pdf.aspx decree attachments that also live under
  # /News/Article/ — keep only the HTML article pages.
  link_pattern: '/en/News/Article/(?!.*(?:getattachment|\.pdf))'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_filter:
    - "statuscode:200"

title:
  selectors: ["h1", ".InsideNewsTitle", "title"]
text:
  # .InsideNewsBox is the clean article body across BOTH template generations (verified on
  # raw id_ snapshots: the 2019 gen and the 2021 redesign both wrap the body in it, childblocks
  # ≈ 1). Do NOT use .col-md-12 / .main-column / .page-content — same text length but they also
  # swallow the surrounding chrome.
  selectors: [".InsideNewsBox", "article"]
date:
  # <time> carries the article date; sampled dates VARY (2019/2020/2021), not clustered on the
  # snapshot date — so this is the article date, not the wayback crawl widget (the Sudan trap).
  selectors: ["time", ".article-date", ".date", ".news-date"]

position: president
# speaker_default omitted: /en/News/Article is a news feed covering the president plus
# administration figures; the cleaner's speaker pass + tenure crosscheck assign per row.
# Georgia's president is a ceremonial head of state (executive power sits with the PM).
date_languages: ["en"]
notes: >
  DRAFT — probe-validated (no full run). Georgia Presidency, PURE-WAYBACK (live site geo-fenced,
  no TCP from outside Georgia). ~513 archived /en/News/Article captures, 2020-2023 (Zourabichvili
  era). English tree scraped; the deeper Georgian /ka-GE/ tree and the pre-2013 Saakashvili site
  are possible additional passes. Selectors verified against archived snapshots. News feed ->
  speaker assigned by the cleaner. Ceremonial head of state.
