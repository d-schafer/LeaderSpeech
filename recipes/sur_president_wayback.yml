# Suriname — the Kabinet van de President and Kabinet van de Vice-President on the government's
# earlier sites, 2010 → 2022, via the Internet Archive: Desi Bouterse (2010–20) and the first
# years of Chan Santokhi (2020–22). The live portal (sur_gov_president) starts in December 2020.
# president.gov.sr no longer resolves (DNS, 2026-10-04).
#
# CDX 2026-10-05 — gov.sr (host, 2010–22, status-200 HTML: 10,219 URLs) and president.gov.sr
# (3,317 URLs of every type). Two site generations:
#   [sr/]kabinet-van-de-[vice-]president/actueel/[archief/<YYYY>/ | archief-2010-2014/
#       nieuwsberichten-<YYYY>/]<slug>.aspx
#       2010–19 Umbraco, on BOTH hosts. The same article sits under up to four paths (with and
#       without the /sr/ prefix, in the year archive and in the 2010–14 archive) and on both
#       hosts — folded on the slug (identity_strip). Title h1; body div#content, which opens with
#       the date ("25-11-2014", day first).
#   actueel/<YYYY>/<slug>/
#       2019–22 site of the President's cabinet (president.gov.sr; 61 of the 2019–20 pages also on
#       gov.sr — folded across hosts). Title h1; body div.entry-content (2022) or div.col-md-8,
#       which holds title, date ("05-04-2022") and text.
# The ministries' news on the same Umbraco portal is sur_gov_wayback; the President's speech
# PDFs are sur_president_speeches_wayback.
# OFFLINE fold check: 1,457 documents — 935 president.gov.sr actueel/<YYYY>/ (2019–22), 62
# gov.sr actueel/<YYYY>/, ~460 Umbraco cabinet articles; first captured 2011 4 / 2012 3 / 2013 32
# / 2014 8 / 2015 29 / 2016 4 / 2017 299 / 2018 41 / 2019 76 / 2020 288 / 2021 331 / 2022 342.
# Bouterse's 2010–19 cabinet news survives thinly (~500 pages). COVERAGE: every cabinet article
# capture; the rest of the missed rows are folded twins and ?page= listings.
# PROBE 2026-10-05 (--spread 14): 1,457 snapshots (= offline); title/text/date 14/14,
# 2011-10 … 2022-06 (incl. the 2012 and 2014 Jaarrede reports).
# LEFT OUT: actueel.aspx?page= listings, onderwerpen/ (topic pages), meest-gestelde-vragen
# (FAQ), president-en-staf (bios), fotogalerij, documenten/ index pages (their PDFs are the
# speeches recipe), contact/zoeken/rss pages.
source_id: sur_president_wayback
country: Suriname
source_language: Dutch
renderer: static

start_urls:
  - gov.sr/
  - president.gov.sr/

listing:
  link_pattern: '^https?://(?:www\.)?(?:president\.)?gov\.sr(?::\d+)?/(?:(?:sr/)?kabinet-van-de-(?:vice-)?president/actueel/(?:archief/\d{4}/|archief-2010-2014/nieuwsberichten-\d{4}/)?[^/?#]+\.aspx|actueel/20\d\d/[^/?#]{8,}/?)$'

pagination:
  type: wayback
  wayback_from: "20100101"
  wayback_to: "20221231"
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
  wayback_collapse: urlkey
  wayback_delay: 5.0
  wayback_identity_strip:
    - '(?<=//)(?:www\.)?president\.(?=gov\.sr)'
    - '(?<=\.sr/)sr/'
    - '(?<=\.sr:80/)sr/'
    - '(?<=/actueel/)(?:archief/\d{4}/|archief-2010-2014/nieuwsberichten-\d{4}/)'

title:
  selectors: ["h1"]
text:
  selectors: ["div.entry-content", "div#content", "div.col-md-8"]
date:
  selectors: ["div#content", "div.col-md-8"]
  # the date opens div#content (Umbraco), or follows the one-line title in div.col-md-8
  regex: '^\s*(?:[^\n]{3,250}\n\s*)?(?P<value>\d{1,2}-\d{1,2}-(?:19|20)\d\d)\b'
  regex_required: true

position: president
date_languages: ["nl"]

notes: >
  Suriname President's and Vice-President's cabinets 2010-2022 (Bouterse, early Santokhi) from
  the Internet Archive: the Umbraco portal on gov.sr and president.gov.sr (folded across paths
  and hosts) and president.gov.sr's 2019-22 site. Day-first dates. No speaker_default.
