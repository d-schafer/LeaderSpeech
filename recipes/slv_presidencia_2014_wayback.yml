# El Salvador — the Presidency's WordPress site under Salvador Sánchez Cerén (June 2014 – May
# 2019), via the Internet Archive. The same host was relaunched for Bukele on 2019-06-01 and
# every earlier post was removed (slv_presidencia takes 2019 onward live).
#
# CDX 2026-09-27 (www.presidencia.gob.sv, first capture per URL in the window, status 200 HTML):
#   root post slugs /<slug>/ ........................ ~4,915 (2014: 670, 2015: 1,198, 2016:
#                                                      1,258, 2017: 910, 2018: 739, 2019: 140)
#   numbered slugs /1-3/, /10304/ …  ................ ~100 (real posts — "/1-3/" is a 2017 story)
#   /gobernando-con-la-gente/<nn>-<place>/ .......... ~98 — the President's "Gobernando con la
#       gente" community dialogues, each with a TRANSCRIPT tab (one page is 65,900 chars)
#   /am_event/<slug>/ ............................... ~360 press-call notices (agenda) — taken
#       per RULE 1; the cleaner drops them
#   /temas/, /tags/ (category listings), /embed/ (4,243 oEmbed stubs), print views, galleries,
#   /wp-content/ — out.
# 2014-2019.presidencia.gob.sv (123 captures) is a frozen copy of the same site with the same
# slugs; folded onto www by wayback_identity_strip.
#
# Selectors, checked on captures from 2014, 2016, 2017 and 2018 + a gobernando page + an
# am_event: title article h1.entry-title (h1.vc_custom_heading on the gobernando pages); body
# article .post-content. Some posts are image-only (an EMPTY .post-content — e.g. the 2016
# "Concluye 34° reunión de Ministros…"): keep_if drops them rather than letting a fallback
# write the page's navigation as a row.
# DATE — deliberately NONE. The article prints no date at all: every a.post-date on the page
# belongs to the related-posts block or the sidebar (a 2016 post carries five of them, none its
# own), the div.datebox has no year, and there is no meta/JSON-LD date. Any of those would be a
# confident wrong date. The run stamps each row's wayback_capture (the site was crawled often,
# so the first capture is usually days after publication) and the cleaner reads the dateline.
# The one selector below (article time[datetime]) matched nothing on the captures checked.
#
# PROBE 2026-09-27 (--spread 14): 5,696 snapshots in the window (offline, first-capture-in-
# window only: 5,515 — so the single bare-host CDX query is not truncated); title + text 13/13
# kept, 1 image-only post filtered; a gobernando transcript page 33,053 chars.
# COVERAGE: ~5,500 of ~5,530 single-segment + gobernando + am_event status-200 pages first
# captured in the window (16 navigation pages left out) — ~99%.
#
# prensa.presidencia.gob.sv (the same government's press WordPress, 128 root-addressed /?p=N
# captures 2014–16) cannot be reached over wayback by the engine — recorded, not authored.
source_id: slv_presidencia_2014_wayback
country: El Salvador
source_language: Spanish
renderer: static

start_urls:
  - presidencia.gob.sv/
  - 2014-2019.presidencia.gob.sv/

listing:
  link_pattern: '^https?://(?:www\.|2014-2019\.)?presidencia\.gob\.sv(?::\d+)?/(?:(?:gobernando-con-la-gente|am_event)/(?!$)|(?!(?:temas|tags|category|author|page|feed|embed|galerias?|multimedia|fotos?|videos?|contactenos|directorio|sample-page|page-composer|page-with-sidebar|pagina-de-alexis|pagina-ejemplo|emblemas-nacionales|simbolos-patrios|servicios-licitacion|noticias|news|discurso|discursos|boletines|declaraciones|presidente|vicepresidenta|vicepresidente|traspaso|novedades|inclusionsocial|tecnica|cultura|component|images|phocadownload|am_event|gobernando-con-la-gente|transparencia|aviso|buscar|search|mapa-del-sitio|institucion|gabinete)/?$))[^/?#.]+/?$'

pagination:
  type: wayback
  wayback_from: "20140601"
  wayback_to: "20190601"
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
  wayback_collapse: urlkey
  wayback_delay: 5.0
  wayback_identity_strip:
    - '(?<=://)2014-2019\.'

title:
  selectors: ["article h1.entry-title", "h1.vc_custom_heading", "title"]
keep_if:
  selectors: ["article .post-content"]
  pattern: '\w{3}'

text:
  selectors: ["article .post-content"]
date:
  selectors: ["article time[datetime]"]
  attr: datetime

position: president
date_languages: ["es"]

notes: >
  El Salvador's presidency WordPress site under Sanchez Ceren (June 2014 - May 2019) from the
  Internet Archive: ~5,000 news/communique posts, the "Gobernando con la gente" community
  dialogues with full transcripts, and press-call notices. The site was wiped at Bukele's
  inauguration. Pages carry no date of their own (dates come from the capture + the cleaner).
  No speaker_default.
