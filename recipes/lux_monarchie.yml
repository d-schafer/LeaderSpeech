source_id: lux_monarchie
country: Luxembourg
source_language: French
start_urls:
  - https://www.monarchie.lu/fr/actualites
renderer: static

# Official site of the Grand Ducal Court of Luxembourg (Cour grand-ducale). NOTE:
# bare monarchie.lu does NOT resolve — must use www.monarchie.lu. Drupal + Tailwind,
# static HTML, honest bot UA. We scrape the French /fr/actualites feed (deep archive,
# 200+ pages). It mixes discours (speeches) with audiences/visits/ceremonies — all
# kept; the cleaner's document_type gate keeps the actual speeches/statements. No
# working discours-only filter (?type/?category are ignored). Article link
# /fr/actualites/<slug>. PAGER: start:1 (bare /fr/actualites is a 13-item featured
# landing; ?page=1 is the first real list page, ?page=2.. advance). Article page has a
# related-news sidebar with MANY dates -> unreliable on-page date, so we take the date
# from the listing card (item_date: p.text-orange-600, dd.mm.yyyy). Card wrapper is a
# Tailwind grid col (matched via [class~='xl:col-span-4']). Title h1, body .prose
# (intro + body). Grand Duke Henri abdicated to Guillaume in Oct 2025 -> speaker left
# to the tenure crosscheck (no default). date_languages fr.
#
# RULE 1 AUDIT 2026-08-14 (sweep chunk A8) — CHECKED CLEAN on breadth, plus one new sibling.
# /fr/actualites looks like the RULE 1 shape (one section) and is not: the nav's fifteen-odd
# "categories" (Discours, Communiqués, Audiences, Conférences, Commémorations, Culture, ...) are
# Drupal FACETS over this same feed — every one is `/fr/actualites?f[0]=categories:NN`, not a
# separate URL space — so the unfiltered feed already IS the union. That also sharpens the older
# note above that "no working discours-only filter" exists: the filter works fine, it simply
# filters this same list. Nothing to widen to in French.
#   * ⚠ THE OTHER THREE LANGUAGE TREES ARE EMPTY SHELLS — measured, and worth recording because
#     the language switcher makes them look like three uncovered siblings. The site advertises
#     /en/news, /de/aktuelles and /lu/noriichten alongside /fr/actualites, and each returns HTTP
#     200 with the full nav, the language switcher and all fifteen category facets — and ZERO
#     article links. Checked three ways on the English tree: the bare listing, `?page=1`, and a
#     category facet all yield 0 article anchors, and `jsinspect.py --renderer js` yields 0 as
#     well, so it is not a JS-rendering problem. /de/aktuelles and /lu/noriichten yield 0 the same
#     way. An English recipe (lux_monarchie_english.yml) was authored against the English tree on
#     2026-08-14 and DELETED the same day once it probed 0 links. The Court publishes in French
#     only; the French feed here is the whole source. Do not re-derive this.
#   * Tool note: `pagecount.py` reports this feed as 8 pages. That is the WINDOWED pager
#     ("1 2 3 … 8 ›"), not the archive size — the 200+-page estimate above stands. pagecount reads
#     the highest pager link on ONE page, so it under-reports any windowed pager.
listing:
  link_selector: "a[href*='/fr/actualites/']"
  link_pattern: '/fr/actualites/[a-z0-9-]+$'
  item_selector: "[class~='xl:col-span-4']"
  item_date:
    selectors: ["p.text-orange-600", "p.text-sm"]

pagination:
  type: query_param
  param: page
  start: 1
  step: 1
  max_pages: 400

title:
  selectors: ["h1", "title"]
text:
  selectors: [".prose", "article"]
# On-page date is polluted by a multi-date sidebar; "time" never matches so the
# listing card's item_date wins.
date:
  selectors: ["time"]

position: grand duke
date_languages: ["fr"]
