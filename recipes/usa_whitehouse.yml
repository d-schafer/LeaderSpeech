# United States — The White House (whitehouse.gov), current administration.
# WordPress site. The unified /news/ feed aggregates EVERY news section (10 posts/page,
# path pagination /news/page/{n}/, dated slugs like /remarks/2025/01/...), so the harvest
# already sees all of them — only the link_pattern decided what was kept.
# English; president is the leader.
#
# RULE 1 WIDENING 2026-08-11 (CHUNK A2). The pattern took 3 of the site's 5 news sections
# and the header used to justify dropping presidential actions as "not speeches" — which is
# no longer the ruling (2026-08-10: legal instruments are IN, subject to the three-part
# test, which these pass: own title, own date, full English text). Section sizes measured
# with recipe_tools/pagecount.py against the live nav:
#   /news/                 198 pages  ~1,980   = the union, and this recipe's start_url
#   /presidential-actions/  61 pages    ~610   ADDED (EOs, proclamations, memoranda,
#                                              nominations; its four nav children are
#                                              sub-views of the same /YYYY/MM/ slugs)
#   /releases/              58 pages    ~580
#   /briefings-statements/  44 pages    ~440
#   /fact-sheets/           34 pages    ~340   ADDED
#   /remarks/                1 page      ~10   this administration files almost nothing
#                                              here — only "The Inaugural Address"
# So the old pattern reached ~1,030 of ~1,980 = 52%.
#
# NOTE ON master_sources: the existing master row for this source is TYPO'd as
# `usa_hitehouse` (missing the "w"). This recipe uses the correct id `usa_whitehouse`;
# the master typo should be reconciled by the researcher.
#
# NOTE ON coverage: the current administration's whitehouse.gov was rebuilt Jan 2025,
# so the live site only covers 2025-01-20 onward. Earlier eras (Biden/Trump-45) are a
# Wayback job (whitehouse.gov/briefing-room/speeches-remarks) — a separate *_wayback.yml.
source_id: usa_whitehouse
country: United States
source_language: English
start_urls:
  - https://www.whitehouse.gov/news/
renderer: static

listing:
  link_selector: "h2.wp-block-post-title a, .wp-block-post-title a"
  # dated-slug posts under any of the five news sections the /news/ feed aggregates
  link_pattern: '/(?:remarks|briefings-statements|releases|fact-sheets|presidential-actions)/\d{4}/\d{2}/[^/]+/?$'

pagination:
  type: path
  path_format: "page/{n}"
  start: 2          # page 1 is the bare /news/ start_url; pager begins at /news/page/2/
  step: 1
  max_pages: 400

title:
  selectors: ["h1.wp-block-post-title", "h1.entry-title", "h1"]
text:
  selectors: [".entry-content", ".wp-block-post-content", "article", "main"]
date:
  selectors: ["time.wp-block-post-date", ".wp-block-post-date time", "time"]
  attr: datetime

position: president
speaker_default: Donald Trump
date_languages: ["en"]
notes: >
  whitehouse.gov (WordPress). /news/ is the unified feed over all five news sections; path
  pagination /news/page/{n}/, 10 posts/page. Title h1.wp-block-post-title -> h1, body
  .entry-content, date time[datetime]. speaker_default Donald Trump (current admin, site
  rebuilt Jan 2025 so live coverage is 2025-01-20+; pre-2025 needs a Wayback recipe).
  Master row is typo'd usa_hitehouse -> should be usa_whitehouse.
  RULE 1 WIDENING 2026-08-11: added fact-sheets + presidential-actions (~52% -> full
  coverage of the /news/ feed). Probe --spread --n 10 harvests 1,876 links (was ~1,030
  matchable) and all 10 sampled pages are green on title/text/date across 2025-01..2026-08,
  including both NEW shapes (/fact-sheets/… 3,036 chars; /presidential-actions/
  constitution-week-2025 4,298 chars, parsed_date correct). INCREMENTAL: do not --rescrape
  — the per-country state file's seen-URL set means a normal run fetches only new matches.
