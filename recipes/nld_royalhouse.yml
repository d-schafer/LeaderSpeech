# Netherlands — Royal House (royal-house.nl), the official ENGLISH site.
# Platform-Rijksoverheid "Search-UI" SPA -> renderer: js. The Dutch site is koninklijkhuis.nl.
#
# ── RULE 1 AUDIT + WIDENING 2026-08-13 (chunk A5) ───────────────────────────────────────────
# Two separate findings, and the first one is the more interesting:
#
# 1. **`?type=speech` NEVER FILTERED ANYTHING.** The recipe's 64 start_urls all carried it and it
#    is a CLIENT-SIDE facet the server-rendered HTML ignores. Measured by fetching cursor pages 1
#    and 20 with and without it: the item sets are IDENTICAL (10 vs 10, zero on either side only),
#    and the "filtered" page 1 contains "Final Report on the Provenance Research of Colonial
#    Objects" and "Conclusions and recommendations …", which are plainly not speeches. Binary-search
#    of the last non-empty cursor page gives 56 for BOTH. So the recipe was already harvesting the
#    whole /documents set — by accident. The parameter is removed: it bought nothing, and it would
#    silently narrow the recipe to a third of its content the day the SPA starts honouring it
#    server-side.
#
# 2. **Two whole sections were missing.** The site's own /sitemap lists a `/latest` tree beside
#    `/documents`. Sized by binary-searching each cursor pager (10 items/page):
#        /documents          56 pages  ~560 items   <- the only section taken
#        /latest/news        37 pages  ~370 items   <- MISSED, its own /latest/news/Y/M/D/ namespace
#        /latest/activities   4 pages  ~ 40 items   <- MISSED
#        /latest/speeches    55 pages  ~550 items   <- NOT ADDED, and deliberately: it is an
#            ALTERNATE INDEX, not a section. Every item link on it points at /documents/Y/M/D/<slug>
#            (checked page 1: all 8 sampled links). Adding it would only re-harvest /documents.
#    That last line is the gov.ro alternate-views test doing its job in the cheapest possible form.
#
# WHY 104 START_URLS AND NOT A PAGER: the cursor is `?current=n_<N>_n`, and neither pagination knob
# can build it — `query_param` writes `?param=<int>` and `path` appends `/<suffix>` to the path.
# `next_link` is out too: from page 2 on, nav.pagination holds TWO `a.screen-reader-only` anchors and
# the FIRST is "Previous page" (verified: page 40's first such anchor is n_39_n), so the engine would
# walk backwards. The pages are enumerated with a small margin over the measured last page.
source_id: nld_royalhouse
country: Netherlands
source_language: English
renderer: js
