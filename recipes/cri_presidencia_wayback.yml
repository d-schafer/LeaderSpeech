# Costa Rica — Presidencia de la República (presidencia.go.cr), May 2014 → 2026, via the Internet
# Archive: the WordPress site of Luis Guillermo Solís (2014–18), Carlos Alvarado (2018–22) and the
# first year of Rodrigo Chaves (2022–23), plus the current Drupal site's news pages that its
# one-page /noticias/ listing no longer shows (cri_presidencia takes the 122 it does show).
#
# CDX 2026-10-05:
#   comunicados/<YYYY>/<MM>/<slug>/   WordPress, 11,507 article URLs (by URL year: 2014 125 /
#                                     2015 1,200 / 2016 1,330 / 2017 1,519 / 2018 1,290 / 2019
#                                     1,344 / 2020 2,177 / 2021 1,696 / 2022 671 / 2023 155) —
#                                     prefix query, because the domain is capped at 60,000 by
#                                     40,332 bicentenario/wp-content images. Title h1.entry-title,
#                                     body .entry-content; date article:published_time (2014–18
#                                     theme) else time.entry-date ("5 mayo 2016").
#   noticias/<slug>                   Drupal (2023 →), 159 captured, 44 of them no longer on the
#                                     live listing (some are records-disposal notices, "acta de
#                                     eliminación de documentos …"). Body .node__content, date
#                                     time[datetime]. Queue AFTER cri_presidencia so the identity
#                                     dedupe skips what the live recipe already holds.
# LEFT OUT: comunicados/tag/ and category/ listings (incl. ?filtered=atoz), /embed/ stubs,
# attachment pages (comunicados/<YYYY>/<MM>/<slug>/<attachment>), month listings, node/<N> (the
# same Drupal nodes as noticias/<slug>), gabinete/ and directorio pages.
# OFFLINE fold check: 11,666 documents (11,507 comunicados + 159 noticias). COVERAGE: every
# article capture on both prefixes.
# PROBE 2026-10-05 (--spread 14): 11,666 snapshots (= offline); title/text 13/14, date 14/14,
# 2014-05 … 2023-12 (incl. Solís's UN speech of September 2015, 24,690 chars). The miss is a
# 7.5 KB capture of a Drupal page; four other Drupal captures extract whole through the engine
# (titles from <title>, ISO dates 2023-09 … 2024-08).
# Chinchilla's 2010–14 Joomla is cri_casapres_chinchilla_wayback.
source_id: cri_presidencia_wayback
country: Costa Rica
source_language: Spanish
renderer: static

start_urls:
  - presidencia.go.cr/comunicados/
  - presidencia.go.cr/noticias/

listing:
  link_pattern: '^https?://(?:www\.)?presidencia\.go\.cr(?::\d+)?/(?:comunicados/20\d\d/\d\d/(?!page/)[^/?#]+|noticias/[a-z0-9-]{10,})/?$'

pagination:
  type: wayback
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
  wayback_collapse: urlkey
  wayback_delay: 5.0

title:
  # the archived Drupal pages (2023–24) have no h1 — their <title> minus the site name
  selectors: ["h1.entry-title", "article h1", "h1", "title"]
  regex: '^\s*(?P<value>.+?)(?:\s+[|–-]\s+Presidencia de la Rep.*)?\s*$'
text:
  selectors: [".node__content", ".field--name-body", ".entry-content"]
date:
  # Drupal's visible date is US-style ("Wed, 06/12/2024 - 20:27") and would be read day-first
  # under the Spanish hint (6 December) — only its ISO datetime attribute is used.
  selectors:
    - "meta[property='article:published_time']@content"
    - "time.entry-date"
    - "time[datetime]@datetime"

position: president
date_languages: ["es"]

notes: >
  Costa Rica presidencia.go.cr from the Internet Archive: the 2014-2023 WordPress comunicados
  (Solis, Alvarado, early Chaves; ~11,500) and the Drupal news pages the live listing dropped.
  Queue after cri_presidencia. No speaker_default.
