# Brazil — Biblioteca da Presidência da República: the ex-presidents' document archive
# (PDFs), 1902–2022, via the Internet Archive.
#
# The Presidency's library keeps a folder per former president under
# biblioteca.presidencia.gov.br/presidencia/ex-presidentes/<name>/ — speeches, interviews,
# radio programmes, trip notes and the annual messages to Congress, stored as Plone File
# objects (PDF). The origin shows "Esta página está em manutenção" on every path since
# mid-September 2026 and was behind an F5 challenge before that; the Archive holds the tree.
#
# RULE 1 WIDENING (2026-09-19, LatAm L2). This recipe used to take Lula's speeches only
# (55 PDFs). The whole ex-presidentes tree was enumerated (CDX, 25,282 unique URLs):
#   * 1,753 URLs carry a PDF capture (statuscode:200, application/pdf). They are now all
#     taken, for every president and every speech-bearing section:
#       discursos — Castello Branco 240, Sarney 161, FHC 156, Goulart 112, Lula 110, Geisel 102,
#         Itamar 96, Costa e Silva 76, Médici 56, Figueiredo 49, Vargas 38, JK 22, Collor,
#         Dutra, Rodrigues Alves, Washington Luís;
#       entrevistas (Lula 280), programas-de-radio (FHC 55), programa-cafe-com-o-presidente
#       (Lula 16), viagens (Bolsonaro 14, Lula 9), notas-oficiais;
#       mensagens ao Congresso — the annual presidential messages, back to the Old Republic
#       (Afonso Pena, Rodrigues Alves, Hermes da Fonseca, Venceslau Brás, Delfim Moreira,
#       Nilo Peçanha, Artur Bernardes, Washington Luís, Vargas … Bolsonaro), incl. Jânio
#       Quadros's 1961 message filed at the top of his folder.
#     Each Plone File is served twice — `…/31.pdf` and `…/31.pdf/@@download/file/31.pdf` — and
#     the Archive holds a PDF capture of one, the other or both; `wayback_identity_strip`
#     takes whichever was captured, once.
#   * The other ~23,500 URLs are HTML: photo galleries (Lula 9,054, Dilma 1,227), audio
#     players, the Plone `/view` wrappers of these PDFs, and — for Lula's speeches — ~900
#     bare object URLs whose only capture is an F5 JavaScript-challenge page (~90 chars,
#     "Please enable JavaScript to view the page content"); sampled, no document behind them.
#     Dilma / Temer / Bolsonaro / Lula II kept their speeches as HTML PAGES, not PDFs: those
#     are bra_biblioteca_html_wayback.
# LEFT OUT, with reasons: caderno-destaques (Dilma's highlights magazine — same call as L1),
# agenda (Bolsonaro's monthly agenda PDFs; Temer's yearly agenda PDFs), orgaos-governo-*
# (organisation charts), publicacoes (FHC's book-length publications), the Lula-era
# vice-presidente folder (2 PDFs, a different office), galleries and audio.
# TEXT QUALITY: the pre-1990 PDFs are scans with an OCR text layer; 5 of 7 sampled
# (Vargas 1930, JK 1956, Geisel 1974, Sarney 1986, FHC 2002) extract 4.8k-13k chars, 2
# (Castello Branco 1965/31, Goulart 1962/06) extract nothing — image-only pages or truncated
# captures, recorded as empty_text failures. Every text opens with the library's six-line
# cover header ("Presidência da República / Casa Civil / … / Coordenação de Biblioteca"), so
# the fallback title (the PDF's first line) is that header for most rows.
source_id: bra_biblioteca_wayback
country: Brazil
source_language: Portuguese
content_type: pdf

start_urls:
  # CDX prefix (no scheme, no trailing '*') — the engine prefix-matches.
  - biblioteca.presidencia.gov.br/presidencia/ex-presidentes

listing:
  # <president>/<speech-bearing section>/<anything below it>, or a message PDF filed at the
  # top of a president's folder. Anchored at scheme+host. Both the bare object and its
  # @@download twin match (the identity strip below keeps one).
  link_pattern: '^https?://(?:www\.)?biblioteca\.presidencia\.gov\.br(?::\d+)?/presidencia/ex-presidentes/[^/?#]+/(?:(?:discursos|dis-cursos|entrevistas|programas-de-radio|programa-cafe-com-o-presidente[^/]*|viagens|pronunciamentos[^/]*|notas-oficiais|mensage[mn]s?-[^/]*)/[^?#]+|mensage[mn][^/?#]*\.pdf)$'

pagination:
  type: wayback
  wayback_filter:
    - "mimetype:application/pdf"
    - "statuscode:200"
  wayback_collapse: urlkey
  wayback_delay: 5.0
  # The object and its @@download twin are one document: take whichever was captured, once.
  wayback_identity_strip: ['/@@download/.*$']

# No DOM in a PDF: text comes from the PDF body, the title falls back to the PDF's first
# line. The date comes from the URL only where the file name carries it — Lula's and
# Itamar's `/YYYY/DD-MM-[YYYY-]…` (assembled unambiguously from named groups). The numbered
# files of the older presidents (`/1965/31.pdf`) carry only a year, which is NOT used: a
# year alone would be completed to an exact-looking wrong date. Their dateline is in the
# text ("RIO DE JANEIRO, 27 DE JANEIRO DE 1956") and the cleaner's date pass reads it; the
# SOURCE URL it sees also names the president and the year folder.
title: {}
text: {}
date:
  url_regex: '/(?P<year>\d{4})/(?P<day>\d{2})-(?P<month>\d{2})-'

position: president
# No speaker_default: the tree spans 1902-2022 and some twenty presidents. The folder in the
# URL names the president; the cleaner assigns the speaker from the text and the date.
date_languages: ["pt"]

notes: >
  PDF-over-Wayback over the Biblioteca da Presidência's ex-presidents' archive: speeches,
  interviews, radio programmes, trip notes and messages to Congress of every president with
  archived PDFs, 1902-2022 (Old Republic messages; Vargas; JK; Goulart; the military
  presidents; Sarney; Itamar; FHC; Lula I-II; Bolsonaro trips). Widened 2026-09-19 from
  Lula's speeches only (55) to every PDF capture in the tree (1,753 captures, @@download twins
  folded). Pre-1990 texts are OCR layers of scans (some empty). Dates from the URL for
  Lula/Itamar; otherwise left to the cleaner. The HTML-era presidents (Dilma, Temer,
  Bolsonaro speeches) are bra_biblioteca_html_wayback. The live origin is in maintenance
  (Sept 2026) and was behind an F5 challenge before.
