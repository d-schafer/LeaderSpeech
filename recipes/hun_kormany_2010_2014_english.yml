  header, each of which independently produces a silent or misleading zero: verify_ssl:false
  for the broken cert chain, <base href> resolution of non-slash-prefixed relative hrefs, and
  a pager that shows only a six-page window while the section actually runs to page 29. Split
  by SPEAKER from hun_kormany_2010_2014_gov_english, which takes the rest of the host
  including prime-minister-s-office/news (PMO press reporting, not the PM speaking). About
  172 fetches — the cheapest recipe in this wave. FULL RUN is the researcher's gate.
