# Iran — Office of the Supreme Leader, the official English site english.khamenei.ir, via the
# Internet Archive. leader.ir (the master source irn_leader) is the native Persian site; this is the
# same leader's official English publication, so Khamenei's addresses land directly in the English
# `text` column (no translation needed).
#
# The address/statement stream lives under /news/<numeric-id>/<slug>. CDX ≈ 9,000 statuscode:200
# English captures spanning 2015–2026 (all within Khamenei's tenure, Supreme Leader since 1989).
source_id: irn_khamenei_english_wayback
country: Iran, Islamic Republic of
source_language: English
renderer: static
start_urls:
  # CDX prefix — engine prefix-matches, NO trailing '*'.
  - english.khamenei.ir/news

listing:
  # numeric news id + slug — e.g. /news/1/Leader-s-Address-to-the-Officials...
  # NARROWNESS-CHECKED 2026-08-10 (RULE 1 sweep, chunk A1) — NO PATTERN CHANGE. Full CDX of
  # english.khamenei.ir: 20,686 raw captures -> 20,672 distinct -> 11,205 in scope; this
  # pattern matches 8,852 = 79.0%. The site has ONE article space (/news/<id>/<slug>) — the
  # nav's Speeches / Statements / Messages / Letters are filtered VIEWS of it, not separate
  # paths — so there is no sibling section to add. The missed remainder, all sampled:
  #   * index.php?option=com_content&task=view&id=<N>  (~1,132 captures, 2008-2015) — the OLD
  #     JOOMLA GENERATION, and the content is real: id=1002 is "Supreme Leader's Address to
  #     Army Cadets". But it is a TABLE-LAYOUT page — no h2 (so this recipe's title chain would
  #     fall through to <title>, which carries a "Khamenei.ir - " prefix the title regex does
  #     not strip), no date element anywhere, and none of the .news_content/.body/article
  #     selectors match. BANKED as a sibling recipe; it needs its own selector chain, a title
  #     prefix strip and a date strategy, so per the standing policy it is banked, not built.
  #   * index2.php?...&pop=1 (~90) — print popups of the same Joomla articles. Duplicates.
  #   * page/archive.xhtml?ms=&pi=&tp= (~970) and archive?tp= — paginated listing pages.
  #   * Opinions/<slug> (14) and subject/<id>/<slug> (4) — curated topic hubs, not documents.
  #   * Dropped upstream as out-of-scope by cdxbatch: /print 8,202, photo 877, gallery 102,
  #     video 61, honor/medal/award 58 — the last of which is an honours register (RULE 1).
  link_pattern: '/news/\d+/[A-Za-z0-9]'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  # h1 is the site logo ("Khamenei.ir"); the article headline is the first h2 (also present in
  # <title> as "<headline> - Khamenei.ir"). The regex strips the " - Khamenei.ir" suffix when the
  # <title> fallback is used.
  selectors: ["h2", "title"]
  regex: '^\s*(.+?)\s*(?:-\s*Khamenei\.ir)?\s*$'
text:
  # article body; generic (trafilatura) fallback recovers it if the class drifts
  selectors: [".news_content", ".body", "article", ".content"]
date:
  selectors: ["time[datetime]", ".news_nav_date", ".date", "time"]

position: Supreme Leader
speaker_default: Ali Khamenei
date_languages: ["en"]
notes: >
  DRAFT — PROBE-VALIDATED (2026-07-26, --spread): 9,002 snapshots; TEXT (article, 362–17,974 chars),
  DATE (.date), speaker (default Ali Khamenei) all GREEN. TITLE trap fixed: h1 is the site logo
  ("Khamenei.ir"), so the recipe reads the first h2 (the article headline, e.g. "Leader's Address to
  the Officials and Executives of the Islamic Republic"), <title> as fallback with a suffix strip.
  Official English site of Iran's Supreme Leader (english.khamenei.ir) via the Internet Archive →
  English column, no translation. Same leader as the native master source irn_leader (leader.ir),
  different host. CDX prefix english.khamenei.ir/news ≈ 9,000 captures 2015–2026 (all within
  Khamenei's tenure, Supreme Leader since 1989). link_pattern keeps /news/<id>/<slug> permalinks. Many
  items are "Leader's Address to ..." speeches; editorial/analysis pieces are rejected by the
  cleaner's document-type gate. FULL RUN is the researcher's gate.
