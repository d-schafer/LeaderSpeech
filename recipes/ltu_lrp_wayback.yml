# ⚠⚠ MEASURED 2026-08-15 (chunk A9): THIS RECIPE IS A 100% MIRROR OF `ltu_lrp_english_wayback`.
# DO NOT QUEUE IT AS-IS — every row it produces is a duplicate.
# Both recipes are source_language: English and both claim lrp.lt's /en/ tree. Grouped offline
# against one CDX enumeration of lrp.lt/en (29,699 collapsed captures):
#     this recipe's link_pattern matches         : 1,016
#     ltu_lrp_english_wayback's matches          : 1,459
#     matched by BOTH                            : 1,016   <- ALL of this recipe's, i.e. 100%
# The sibling's `/en/media-center/news/[a-z]` alternative is a strict superset of this recipe's
# `/en/media-center/news/<slug>/<id>$`. The comment below calls this "the native ltu_lrp_wayback",
# but it is not native — its start_url prefix is lrp.lt/EN and its language field says English.
# Lithuania therefore has TWO English archive recipes and NO Lithuanian one at all, even though
# lrp.lt is natively Lithuanian.
#
# RECOMMENDED (researcher's call, NOT done here because it changes an existing scraped source):
# REPURPOSE this file into the Lithuanian-language recipe — swap the prefix to lrp.lt/lt, set
# source_language: Lithuanian, and keep the selectors, which are the same template. That converts
# a pure duplicate into the missing native-language source. Deleting it outright is the other
# option. Left untouched and OUT of the A9 queue meanwhile.
source_id: ltu_lrp_wayback
country: Lithuania
source_language: English
start_urls:
  - lrp.lt/en/media-center/news
renderer: static

# WAYBACK recipe for the President of Lithuania (lrp.lt). The LIVE site is behind a
# Cloudflare managed challenge that neither the bot UA, a browser UA, nor headless
# Chromium (Playwright times out on networkidle) can clear — so it is live-blocked and
# the IA archive is the route. We scrape the archived ENGLISH news
# /en/media-center/news/<slug>/<id> (1780 caps, 2019-2024, President Nausėda's term,
# plus older items about Grybauskaitė) -> English title/text, no translation. Archived
# page: title h1 (inside div.news_inner), the article date is an ISO string right after
# the title in .news_inner (regex-isolated; the standalone .date elements are a recent-
# news sidebar), body .news_inner / generic fallback. Speaker from the tenure crosscheck.
listing:
  link_pattern: '/en/media-center/news/[a-z][a-z0-9-]+/\d+$'

pagination:
  type: wayback
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
  wayback_collapse: urlkey
  wayback_delay: 5.0

title:
  selectors: ["h1", "title"]
text:
  selectors: [".news_inner", "article", "main"]
date:
  selectors: [".news_inner"]
  regex: '\d{4}-\d{2}-\d{2}'

position: president
date_languages: ["en"]
