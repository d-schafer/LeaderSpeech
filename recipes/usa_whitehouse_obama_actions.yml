# United States — Obama White House, NARA archive: PRESIDENTIAL ACTIONS.
# Sibling of usa_whitehouse_obama / _statements / _briefings. Same host, same frozen Drupal
# snapshot, same selectors, same /the-press-office/ namespace; only the frozen taxonomy view
# differs (tid=46). See usa_whitehouse_obama_statements.yml for why the four views cannot be
# one recipe (the pager filename embeds the tid, and a wrong tid 404s).
#
# LEGAL INSTRUMENTS — sampled, IN SCOPE. Executive orders, proclamations, presidential
# memoranda, letters and notices. They pass the researcher's 2026-08-10 three-part test:
# each item has its OWN title ("Presidential Proclamation -- Religious Freedom Day, 2017"),
# its own date, and full English text in the recipe's source_language. Proclamations in
# particular are ceremonial/rhetorical rather than boilerplate. ~2,120 items, not the
# "thousands of pages of legal boilerplate" case that gets flagged and left.
source_id: usa_whitehouse_obama_actions
country: United States
source_language: English
start_urls:
  - https://obamawhitehouse.archives.gov/briefing-room/presidential-actions
renderer: static

listing:
  link_selector: "a[href*='/the-press-office/']"
  link_pattern: '/the-press-office/(?:\d{4}/\d{2}/\d{2}/)?[a-z][a-z0-9-]+/?$'

pagination:
  type: path
  path_format: "index__q_term_node_tid_depth=46&page={n}.html"
  start: 1          # page 0 is the bare start_url; the frozen pager runs page=1..211
  step: 1
  max_pages: 240    # last real page measured at 211; stops early on an empty page

title:
  selectors: [".pane-node-title", "h1#page-title", "#page-title", "h1", "title"]
text:
  selectors:
    - ".field-name-field-forall-body"
    - ".pane-node-field-forall-body .forall-body"
    - ".panel-col-section-content .forall-body"
    - "article"
    - "main"
date:
  selectors: ["#press_article_date_created", ".press-article-date", ".date-display-single", "time"]

position: president
speaker_default: Barack Obama
date_languages: ["en"]
notes: >
  obamawhitehouse.archives.gov Presidential Actions (~2,120 items, 211 frozen pager pages of
  10). Written during the CHUNK A2 narrowness sweep 2026-08-11. Selectors IDENTICAL to
  usa_whitehouse_obama — same frozen snapshot, one layout. INCREMENTAL: shares
  data/state/United States.json with the other USA recipes, so anything already scraped is
  skipped — never --rescrape.
