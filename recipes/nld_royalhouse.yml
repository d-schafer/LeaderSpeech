listing:
  link_pattern: '/(documents|latest/(news|activities))/\d{4}/\d{2}/\d{2}/'

pagination:
  type: none      # each cursor page is its own start_url — see the header

title:
  selectors: ["h1"]
text:
  selectors: ["main article", "main"]
date:
  # The permalink carries an unambiguous ISO date in named groups, which the engine assembles
  # directly (no dateparser, no locale ambiguity). Covers all three namespaces.
  url_regex: '/(?:documents|latest/(?:news|activities))/(?P<year>\d{4})/(?P<month>\d{2})/(?P<day>\d{2})/'

# No speaker_default: the site publishes for the whole Royal House — King Willem-Alexander,
# Queen Máxima, Princess Beatrix and others — so the cleaner's speaker pass must decide.
date_languages: ["en"]
notes: >
  WIDENED 2026-08-13 (chunk A5). Two findings. (1) The `?type=speech` filter on all 64 old
  start_urls was a CLIENT-SIDE facet the server ignores — cursor pages 1 and 20 return byte-identical
  item sets with and without it, and the "filtered" list contains the Provenance Research report —
  so it was removed; it bought nothing and would have silently narrowed the recipe the day the SPA
  started honouring it. (2) The site's own /sitemap shows a /latest tree beside /documents:
  /latest/news (37 cursor pages, ~370 items) and /latest/activities (~40) were missing entirely and
  are now taken. /latest/speeches (55 pages) was checked and deliberately NOT added — every item on
  it links to /documents/Y/M/D/<slug>, so it is an alternate index, not a section. Section depths
  measured by binary-searching each cursor pager; start_urls carry a small margin over the last
  non-empty page. Some documents are German/French renderings of the same speech (the site
  publishes state-visit texts in the host language); they are distinct documents with their own
  permalinks, and the cleaner records per-document language. renderer: js, so budget on measured
  headless-Chromium rates, not the 4,467 pages/h static-live figure. NO --rescrape.
  FULL RUN is the researcher's gate.
