# Finland — President of the Republic (presidentti.fi), FINNISH-language newsroom.
#
# ── RULE 1 WIDENING 2026-08-13 (chunk A5) ───────────────────────────────────────────────
# This recipe filtered on ONE category, `puhe` (21) = 52 of the site's 1,994 posts = 2.6%.
# recipe_tools/wpjson.py on the REST root gives the whole vocabulary, and it is trilingual —
# every post carries exactly one category and the nine categories are three parallel sets:
#     FI   uutinen 1 = 356   tiedote 114 = 318   puhe 21 = 52     -> 726
#     SV   nyhet  14 = 344   pressmeddelande 116 = 250  tal 25 = 52
#     EN   news    9 = 323   press-release 118 = 251  speech 23 = 52
# So the recipe took the section literally called "speeches" and left the news and press-release
# streams — 674 further FINNISH posts, 13x what it held — untouched. Now categories=1,21,114:
# 52 -> 725 posts (x-wp-total, 2024-02-28 -> present).
#
# The existing header's note that 21/23/25 hold the SAME 52 speeches is CORRECT and unchanged —
# they are translations, so only ONE language's categories may be taken here. The three FINNISH
# ids are the right set for a source_language: Finnish recipe.
#
# ⚠ ALSO FIXED: a latent date bug that the 52-speech validation did not expose. `time` matches
# THREE elements on every article — the article's own date plus TWO "you might also like" cards
# in a wp-block-post-template query loop at the foot of the page — and the engine JOINS all
# matches, so the stored value was three ISO datetimes concatenated, the second and third being
# the crawl-day dates of unrelated posts. This is the run-5 `.date` sidebar-feed trap exactly.
# Scoped with :not(ul.wp-block-post-template time); bare `time` stays as the fallback.
#
# OUT: the `event` CPT (128 items) is the weekly engagement diary — title "Viikko 32 –
# Tasavallan presidentin ohjelma", body a wp-block-event-date-picker widget, no prose. Sampled
# 2026-08-13 and rejected, same call as Croatia's /najave/ and Latvia's /en/event/ in chunk A3.
# Also out: `gallery` (231) by RULE 1, `blog` (0 items).
#
# WHY api AND NOT AN HTML LISTING: presidentti.fi is WordPress with a JS front end. The
# speech listing is a HASH-FRAGMENT SPA — /puheet/ and /category/puhe/ both redirect to
# /ajankohtaista/#/?search=&…&contentTypes=POST&categories=puhe, whose static HTML carries
# no article links, and /category/puhe/page/2/ is a 404. Its RSS feed exists but serves
# only the latest 10 of 52. The REST API is the one route to the full set.
#
# The speech PAGES, by contrast, are plain server-rendered HTML — so the JSON supplies the
# links and the engine fetches each page for clean text.
source_id: fin_presidentti
country: Finland
source_language: Finnish
start_urls:
  # The three FINNISH categories: 1 uutinen (news), 114 tiedote (press release), 21 puhe
  # (speech). Find ids via /wp-json/wp/v2/categories?per_page=100 — they are stable but worth
  # re-checking if the harvest ever empties. 100 is WordPress's max per_page.
  # Do NOT add 9/118/23 (EN) or 14/116/25 (SV): those are the same posts in another language.
  - https://www.presidentti.fi/wp-json/wp/v2/posts?categories=1,21,114&per_page=100
renderer: static

listing:
  link_pattern: 'presidentti\.fi/[^/]+/?$'

pagination:
  type: api
  param: page       # WordPress pages with ?page=N and returns HTTP 400
  start: 1          # ("rest_post_invalid_page_number") once you run past the end, which
  step: 1           # the engine logs and treats as "stop here" — expected, not a failure.
  max_pages: 20     # 725 posts / 100 per page = 8 pages; headroom for growth
  api:
    # "." = the response IS the array. WordPress returns a bare JSON list at the root, and
    # a dotted path cannot address one (it needs at least one key). Engine support for this
    # was added for this recipe.
    results_path: "."
    url_field: link
    title_field: title.rendered
    date_field: date
    # text_field is deliberately NOT set. WP's content.rendered is HTML, so setting it would
    # store markup as the speech body AND skip the page fetch entirely. Leaving it unset
    # lets the engine fetch each `link` and use the `text` selector below for clean prose;
    # the JSON is used only for url/title/date.

title:
  selectors: ["h1", "title"]
text:
  selectors: [".entry-content", "article"]
date:
  # attr: datetime IS THE POINT — do not drop it to read the element's text.
  # <time datetime="2026-06-10T19:39:08+03:00">10.6.2026</time>
  # The TEXT is Finnish numeric day-first and is a silent-corruption trap:
  #   "10.6.2026" -> 2026-06-10 with ["fi"]   (correct: 10 June)
  #   "10.6.2026" -> 2026-10-06 with ["en"] AND with ["fi","en"]   (WRONG: 6 October)
  #   "1.7.2026"  -> 2026-07-01 with ["fi"] / 2026-01-07 otherwise
  # The datetime ATTRIBUTE is ISO 8601, so it is unambiguous in any locale and cannot drift.
  # The api's `date` field (also ISO) is the engine's fallback if this ever stops matching.
  #
  # THE :not() IS LOAD-BEARING — see the header. Every article page ends with a two-card
  # "you might also like" query loop (ul.wp-block-post-template), each card carrying its own
  # <time>, so a bare `time` matches 3 elements and the engine joins ALL of them:
  #   '2026-05-08T20:46:23+03:00 2026-08-10T16:16:21+03:00 2026-08-10T11:42:52+03:00'
  # i.e. the article's real date followed by two crawl-day dates from unrelated posts.
  selectors: ["time:not(ul.wp-block-post-template time)", "time"]
  attr: datetime

position: president
# speaker_default deliberately omitted, same reasoning as est_president: the archive floor
# (2024-03-01) is Alexander Stubb's own inauguration day, which shows the site drops the
# outgoing president — Sauli Niinistö (2012-2024) is simply gone. A hard-coded speaker would
# therefore silently mislabel the NEXT president's speeches. The tenure crosscheck assigns
# it correctly from country+date and cannot go stale.
#
# Kept as a belt-and-braces for the day the datetime attribute disappears. MUST stay ["fi"]
# alone — never ["fi","en"]: dateparser lets the first matching locale win, and "en" reads
# Finnish day-first dates month-first (see above).
date_languages: ["fi"]
notes: >
  WIDENED 2026-08-13 (chunk A5) from the single `puhe` category (52 posts, 2.6% of the site)
  to all three FINNISH categories — uutinen 356 + tiedote 318 + puhe 52 = 725 posts,
  2024-02-28 -> present. Also fixed a latent date bug the 52-speech validation never exposed:
  a bare `time` selector joined the article's date to TWO related-posts cards, so the stored
  value was three ISO datetimes (see the date field's comment). Coverage floor is Alexander
  Stubb's inauguration — Niinistö (2012-2024) is gone from the live site; the wayback companion
  fin_presidentti_english_wayback holds that era. Listing is REST-only (the HTML listing is a
  hash-fragment SPA; RSS carries only the latest 10); article pages are static HTML.
  Categories 21/23/25 (puhe/speech/tal) hold the SAME 52 speeches and 1/9/14 + 114/118/116 are
  likewise FI/EN/SV renderings of one content set, so exactly one language's trio may be taken
  here. ⚠ SEE fin_presidentti_english: it is this same content set in its OFFICIAL ENGLISH
  rendering (625 posts, no translation step needed) and is the one to run under the English-first
  policy. RUN ONE OR THE OTHER, NOT BOTH — the per-country state file skips on the exact URL and
  the FI and EN permalinks differ, so running both would land ~600 duplicate documents.
  NO --rescrape: the newly matched URLs were never in the state file's seen set.
  Finland's president is the head of state with real foreign-policy powers but the PM leads
  the government (valtioneuvosto.fi) — a separate source, not in master_sources.
