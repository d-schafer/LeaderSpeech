# Singapore — Prime Minister's Office (pmo.gov.sg), via the Internet Archive.
# English-native → English column. "yes-and" to the live sgp_pmo (which enumerates the CURRENT Isomer
# sitemap): the Archive holds the OLDER /Newsroom/<Title-Case-slug> CMS generation (2016–2023) — the PM
# Lee Hsien Loong / SM Teo Chee Hean / DPM Heng Swee Keat era that the current sitemap no longer lists.
# Distinct from sgp_istana (the ceremonial President) and sgp_istana_wayback.
#
# RULE 1 AUDIT 2026-08-11 (CHUNK A2) — NARROW, and the missing blocks are BANKED not widened.
# cdxbatch over the whole host: 27,182 raw captures -> 20,740 in scope; this pattern matches
# 3,119 = 15.0%. That headline ratio is misleading: 12,111 of the "missed" captures are the
# faceted-search listing /Newsroom?page=&keywords=&from=&topic=&year=&type=, which is a LISTING
# and correctly excluded. What is genuinely missed are THREE OLDER CMS GENERATIONS, all sampled:
#   /mediacentre/<slug>            880 captures, 2015-2016. Real speeches ("address-prime-
#                                  minister-lee-hsien-loong-gala-dinner-international-housing-
#                                  conference"). CANNOT share this recipe: <h1> is the site
#                                  banner "Prime Minister's Office Singapore", so the ["h1",
#                                  "title"] chain here would title every row identically. Its
#                                  own chain would be title=<title>, text=article (11,724
#                                  chars), date=.date ("20 Mar 2015").
#   /News/{Speeches,Transcripts,   ~1,070 captures, 2008-2010, incl. National Day Rally and
#     PressReleases,Messages}/     National Day Message texts. CANNOT share: table-layout page,
#     <Title+Case>.htm             `td` is the only container and joins to 20,218 chars of nav
#                                  (the element-join trap), no <h1>, no date element, and
#                                  <title> carries a "Prime Minister's Office - " prefix.
#   /nda/…tlsm_N.html +            ~300 captures, the pre-2004 National Day Rally archive.
#     /pmohq/nda/<year>/…          Static .html, not sampled yet.
# Everything else in the miss is out of scope: /Topics/*?page= facets, /cabinet/<minister> bios,
# /PMO/Templates/*.aspx?NRMODE= CMS artifacts, awards/photos/honours.
source_id: sgp_pmo_wayback
country: Singapore
source_language: English
renderer: static
start_urls:
  # CDX prefix — matches both the old /Newsroom/ and the modern /newsroom/ (urlkey normalizes host).
  - pmo.gov.sg/Newsroom

listing:
  # Title-Case article slug /Newsroom/<Slug> (require a long-ish slug to skip short category words); the
  # faceted search /Newsroom?page=…&keywords=… has no '/' after Newsroom so it can't match.
  link_pattern: '/[Nn]ewsroom/[A-Za-z][A-Za-z0-9-]{10,}'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  selectors: ["h1", "title"]
text:
  selectors: ["main", "article", ".content"]
date:
  # publication date sits in the header before the body ("D Month YYYY"); regexed out of the article
  # container (the dedicated label shares a class with speaker/topic labels — the live recipe's lesson).
  selectors: ["main", "article"]
  regex: '\d{1,2}\s+[A-Z][a-z]+\s+20\d\d'

position: prime minister
date_languages: ["en"]
notes: >
  DRAFT — Wayback companion ("yes-and") to the live sgp_pmo. Targets the OLDER /Newsroom/<Title-Case>
  permalink (PM Lee Hsien Loong / SM Teo / DPM Heng era, 2016–2023). CDX ≈ 17k /Newsroom captures (many
  are faceted-search re-crawls the link_pattern excludes). NO speaker_default (multiple office-holders)
  → cleaner's speaker pass + document_type gate. VERIFY AT PROBE the older /Newsroom/ pages archive with
  a real body (not an Isomer/JS shell). FULL RUN is the researcher's gate.
