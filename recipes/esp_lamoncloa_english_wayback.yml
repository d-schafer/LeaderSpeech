# Spain — La Moncloa / President of the Government (PM), the ENGLISH tree /lang/en/, via the Internet
# Archive. ENGLISH sibling of the native esp_lamoncloa_wayback (Spanish). The English intervenciones
# land directly in the English `text` column (no translation needed). "yes-and" to the native recipe.
#
# The live listing paginates only via __doPostBack (see the native recipe), so pure-wayback. The
# English dated speech pages are archived cleanly: CDX for
# lamoncloa.gob.es/lang/en/presidente/intervenciones ≈ 198 statuscode:200 English captures spanning
# 2008–2026 (Zapatero 2008 investiture; Rajoy 2011–2018; Sánchez 2018– ).
source_id: esp_lamoncloa_english_wayback
country: Spain
source_language: English
renderer: static
start_urls:
  # CDX prefix — engine prefix-matches, NO trailing '*'.
  - lamoncloa.gob.es/lang/en/presidente/intervenciones/Paginas

listing:
  # dated speech permalink: /lang/en/presidente/intervenciones/Paginas/<year>/<slug>.aspx
  # ([^?]+ tolerates/excludes any trailing ?qfr= query the archive recorded)
  link_pattern: '/lang/en/presidente/intervenciones/Paginas/\d{4}/[^?]+\.aspx'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  # reuse the native esp_lamoncloa_wayback selectors (same SharePoint template)
  selectors: ["h1", "title"]
text:
  selectors: [".customWidth", ".contentPage", "article", "main"]
date:
  # .date carries "28.5.2024" (DD.M.YYYY day-first); the URL's 8-digit date is inconsistent across
  # years (2024+ YYYYMMDD vs 2021- DDMMYYYY), so prefer the on-page value. date_languages es: the
  # numeric date string is language-independent, so it parses on the English pages too.
  selectors: [".date", "[class*=fecha]"]
  regex: '\d{1,2}\.\d{1,2}\.\d{4}'

position: prime minister
date_languages: ["es"]
notes: >
  DRAFT — Wayback ENGLISH sibling of the native esp_lamoncloa_wayback (yes-and; genuine English →
  English column, no translation). CDX prefix lamoncloa.gob.es/lang/en/presidente/intervenciones ≈ 198
  statuscode:200 captures 2008–2026 (Zapatero 2008 investiture, Rajoy 2011–2018, Sánchez 2018– ).
  link_pattern keeps the dated /lang/en/…/Paginas/<year>/<slug>.aspx permalink. Reuses the native
  recipe's h1/.customWidth/.date selectors (same SharePoint template). Multiple PMs → NO
  speaker_default; the cleaner's tenure crosscheck assigns the speaker. PROBE-VALIDATED (2026-07-26,
  --spread --n 6): 189 snapshots; GENUINE English — TITLE(h1) clean (e.g. "Speech by José Luis
  Rodríguez Zapatero at investiture debate", "Speech by Acting President at the Gates Foundation
  'Goalkeepers' event"), TEXT(.customWidth) 5,947–61,301 chars, DATE(.date) working (some fall to the
  cleaner). FULL RUN is the researcher's gate.
