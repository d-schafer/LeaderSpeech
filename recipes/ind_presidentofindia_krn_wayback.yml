# India — President of India, the OLDEST archived generation: the static /S/html tree,
# captured 2002-2004, holding K. R. Narayanan's presidency (1997-2002) and the start of
# A. P. J. Abdul Kalam's. This is the deepest Indian presidential material that exists
# anywhere in the corpus — the next-oldest recipe (ind_presidentofindia_old_wayback) starts
# in 2008.
#
# THE TREE, from the CDX index (1,849 captures under presidentofindia.nic.in/S/html;
# 491 in 2002, 353 in 2003, 58 in 2004):
#     /S/html/krn/speeches/<section>/<file>.htm    259   Narayanan's own subtree ("krn")
#     /S/html/speeches/others/<file>.htm           236
#     /S/html/speeches/credentials/<file>.htm      127   addresses to incoming ambassadors
#     /S/html/speeches/banquet/<file>.htm           44
#     /S/html/speeches/foreigntrip/<file>.htm       35
#     /S/html/speeches/{indepen,republic,parliament,fladyspeech}/…  ~31
#     /S/html/press_release/press-new/pr<N>.htm    211   NOT taken (press releases)
#     /S/html/rb/…, /S/html/flow/…                  ~60  NOT taken (Rashtrapati Bhavan
#                                                        art gallery / museum / flower show)
# The section INDEXES (e.g. /S/html/krn/speeches.htm, a 485-char left-nav page listing
# "Republic Day / Independence Day / Farewell Address / Banquets / …") are excluded by
# requiring a further /<file> segment after the section.
#
# TRAP NOTE: start_urls is /S/html rather than the bare host — that prefix is not itself an
# article path, so filter_entries_for_recipe drops nothing, and it narrows the CDX query to
# 1,849 captures instead of the host's 14,473.
source_id: ind_presidentofindia_krn_wayback
country: India
source_language: English
renderer: static
start_urls:
  - presidentofindia.nic.in/S/html

listing:
  # Any speech section, one file deep. `^[^?]*` bars a query string before the match, the
  # same guard the sibling recipe needed after the site's ASP.NET error page
  # (/error.htm?aspxerrorpath=/sp040609.html) was harvested as a speech.
  # ⛔ RULE 1 WIDENING 2026-08-12 (chunk A4): `press_release` added — 564 captures in the same
  # /S/html tree that this recipe was reaching into for speeches only (761). Measured over the
  # full presidentofindia.nic.in CDX index; those two are the whole tree's article content
  # (the other 45 keys are chrome: flow 55, rb 30, walktrhugh 16, mughal, herbal, frames…).
  # NOTE THE DEPTH DIFFERS, which is why this needs two branches rather than one alternation:
  #   speeches       /S/html/[krn/]speeches/<section>/<file>.htm   TWO segments
  #   press_release  /S/html/[krn/]press_release/<file>.htm        ONE segment
  # `\.html?$` also keeps /S/html/press_release/ErrorPage.aspx out by construction.
  link_pattern: '^[^?]*/S/html/(?:krn/)?(?:speeches/[^/]+/[^/]+|press_release/[^/]+)\.html?$'
  # The date on the press_release shape was an open follow-up when this widening landed
  # (probe date 4/10, every miss a press release) and is now RESOLVED — see the `date` field.

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  # These pages have NO classes and NO headings at all — <title> is the bare site banner
  # ("President of India") and there is no h1/h2. The headline is a <b> block at the very
  # top of the single content cell, and it carries the dateline with it, e.g.
  # "SPEECH BY SHRI KOCHERIL RAMAN NARAYANAN ON HIS ASSUMPTION OF OFFICE AS PRESIDENT OF
  #  INDIA New Delhi, 25 July, 1997, 3 Sravana, 1919".
  selectors: ["b", "title"]
text:
  # No classes exist on the document; `body` and the outer `td` return identical text
  # (measured: 7,839 chars each on july25_1997.htm), so `body` is used — it cannot
  # double-count the way a `td` selector does on nested tables, because the engine joins
  # every matching element.
  selectors: ["body"]
date:
  # DELIBERATELY scoped to the SAME <b> block as the title, NOT to the body. That block is
  # the headline + dateline and nothing else, so "the first date in it" is the delivery date
  # by construction. Running the same regex over the body would reintroduce the Koizumi
  # failure — these addresses quote historical dates in their opening paragraphs.
  # The filename carries the date too (july25_1997.htm) but as a month NAME, which the
  # engine's named-group assembly cannot parse; the dateline is the cross-check for it.
  #
  # TWO DETAILS PAID FOR BY A BAD PROBE ROW:
  #   * `\s*(?:st|nd|rd|th)?` — the ordinal suffix is sometimes SPACED OFF the number on
  #     these pages ("New Delhi, 10 th May, 2001"), which a `\d{1,2}\s+\w+` pattern misses.
  #   * `regex_required: true` — without it, a miss returns the WHOLE <b> block (headline
  #     + all), and dateparser turned "SPEECH BY THE PRESIDENT AT THE BANQUET HOSTED IN
  #     HONOUR OF …" into TODAY'S DATE. Now a miss just leaves the date blank.
  #
  # `body` ADDED 2026-08-12 as a LAST RESORT, for the newly-harvested press_release shape.
  # DEBUGGED rather than guessed. The note above is right that a month NAME in the filename
  # is unusable, and here is exactly why, from extract.py: when a date `url_regex` captures
  # named year/month/day groups the engine calls `_iso_from_named_groups`, which does
  # `int(gd["month"])` — a text month raises and returns None, and the code then DELIBERATELY
  # does not fall through to dateparser ("a blank date beats a plausible wrong one"). Only a
  # url_regex WITHOUT the named triple reaches dateparser. So no url_regex can date
  # `sept30_99.htm`, and the fix had to come from the page.
  # It does: these pages carry the dateline in the BODY, not in <b> — "RASHTRAPATI BHAVAN,
  # April 6, 2001" as the first line, before "PRESS RELEASE" and the text (verified on
  # apr06_01.htm and sept30_99.htm). `b` matches EMPTY on this shape, and an empty match does
  # not end a chain (`first_match` tests `if value:`), so the chain simply walks on to `body`.
  # THE REGEX NEEDED NO CHANGE — its second alternative already matches month-first
  # "April 6, 2001" as well as the speeches' day-first "10 th May, 2001".
  # The Koizumi risk the note above warns about is bounded here: `body` is only reached when
  # <b> is empty (i.e. the press-release layout), the pages are ~1,500 chars, and the dateline
  # is the FIRST date on them, which is what leftmost-match returns.
  selectors: ["b", "body"]
  regex: '\d{1,2}\s*(?:st|nd|rd|th)?\s+\w+,?\s+(?:19|20)\d\d|\w+\s+\d{1,2}\s*(?:st|nd|rd|th)?,?\s+(?:19|20)\d\d'
  regex_required: true

position: president
# No speaker_default: the tree spans Narayanan and early Kalam (and a handful of First Lady
# items under /fladyspeech, which the cleaner's speaker pass will type correctly), so the
# tenure crosscheck assigns from country+date.
date_languages: ["en"]
notes: >
  DRAFT — probe-validated, no full run (gap-closing wave 2, 2026-08-10). The oldest archived
  presidentofindia.nic.in generation: the static /S/html speech tree, captured 2002-2004,
  content reaching back to Narayanan's 1997 assumption-of-office address. ~730 speech
  captures across eight sections. Sampled bodies ~7,800-9,300 chars — full transcripts with
  no nav pollution worth speaking of. The site offers no headings and no classes, so title
  and date both come from the single <b> headline/dateline block; scoping the date regex to
  that block rather than the body is what makes a body-text date safe here. Press releases
  (/S/html/press_release, 211) and the Rashtrapati Bhavan art-gallery / museum / flower-show
  trees are excluded. FULL RUN is the researcher's gate.
