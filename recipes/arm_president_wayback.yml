# Armenia — president.am press releases via the Internet Archive.
#
# The RELIABLE companion to recipes/arm_president.yml: the live site is behind a
# Radware behavioral WAF that (together with the engine's networkidle js-wait) makes
# live full runs unreliable, so the archive is the dependable path. Probe-verified:
# 8,152 CDX snapshots of /en/press-release/item/ permalinks, spanning 2008-2022
# (Presidents Serzh Sargsyan, Armen Sarkissian, Vahagn Khachaturyan). This is NOT a
# wayback conversion of a working live recipe — the live recipe stays as
# arm_president.yml; this one exists because the live run is currently unreliable and
# to reach the pre-2022 history.
#
# 2026-08-10 WIDENED — press-release was only ONE of the site's eleven article sections.
# Armenia is the third-largest measured audit gap (343 unmatched corpus rows, 304 of them
# Serzh Sargsyan 2007-2018) despite this source having already produced 8,157 rows, which
# is the signature of a harvest that is deep but NARROW. Enumerating the full CDX index
# (38,107 unique status-200 text/html captures under president.am/en) by section:
#     press-release                  10,950   (was the only one harvested)
#     decrees                        10,329   EXCLUDED — SAMPLED, see the note below
#     congratulatory                  2,586   <- added
#     condolence                        801   <- added
#     signed-laws                       733   EXCLUDED — same
#     domestic-visits                   732   <- added
#     statements-and-messages           698   <- added  (the president's own addresses)
#     foreign-visits                    423   <- added
#     videos                            379   EXCLUDED — video pages, no transcript
#     interviews-and-press-conferences  297   <- added  (verbatim Q&A)
#     notepad                           239   <- added
#     chronicle                          67   <- added
#     announcements                      10   <- added
# statements-and-messages and interviews-and-press-conferences are the two that most
# obviously carry a leader's own words and were entirely missing.
#
# DECREES / SIGNED-LAWS — RECONSIDERED AND THEN SAMPLED, 2026-08-10. The researcher moved
# legal instruments into scope, so these 11,062 captures were re-examined. They were then
# SAMPLED, per RULE 1's never-dismiss-an-endpoint rule applied in the other direction — never
# ADD one without sampling either — and they do not belong in a speech corpus:
#   * URL shape is /en/decrees/item/<N>/ — a BARE NUMERIC ID with no date anywhere in the URL,
#     unlike every speech section here (/item/YYYY/MM/DD/<slug>/). So the existing
#     link_pattern never matched them in the first place: adding the two section names to it
#     moved the probe only 11,620 -> 12,189, and that increment was not decrees.
#   * The pages are ~1,150-1,325 chars of which most is nav chrome. h1/h2/<title> are the
#     generic section header ("Decrees of the President of RA") on EVERY item, so there is no
#     per-document title, and there is no date element at all.
#   * The body is in ARMENIAN even under /en/ — e.g. item/1 is "ՀԱՅԱՍՏԱՆԻ ՀԱՆՐԱՊԵՏՈՒԹՅԱՆ
#     ՆԱԽԱԳԱՀԻ ՀՐԱՄԱՆԱԳԻՐԸ / Հայաստանի Հանրապետության վարչապետ նշանակելու մասին" = "Decree of
#     the President of the RA / On appointing the Prime Minister of the RA". So they would
#     also violate this recipe's source_language: English.
#   * Content is boilerplate appointment and administrative orders ("On appointing S.
#     Ghukasyan Head of the Military Police of the Ministry of Defence"), not oratory.
# VERDICT: flagged, not scraped. A decree register with no title, no date and the wrong
# language is its own project — it wants its own recipe with Armenian selectors and a
# document-id scheme, not a widening of this one.
# ─────────────────────────────────────────────────────────────────────────────────────────
# 2026-09-02 — WIDENED AGAIN, AND A TITLE DEFECT FIXED. Armenia was still the second-largest
# unmatched block (254 rows, 2007-2021) AFTER the 2026-08-10 widening, which is the signature
# of a gap the pattern cannot express. Two separate causes, both measured:
#
# 1. AN ENTIRE URL GENERATION WAS UNREACHABLE BY CONSTRUCTION. Before ~2013 this site put the
#    language in a path SEGMENT — /events/<section>/eng/?id=<N> — not a prefix. `start_urls`
#    was `president.am/en`, and that is a CDX *prefix* query, so the old tree was excluded
#    server-side before `link_pattern` ever ran. No amount of widening the pattern could have
#    found it. CDX for `president.am/events`: 5,346 captures, 2008-2012, of which 1,496 are
#    /eng/ and 881 are English ARTICLE pages carrying an `id`.
#    SAMPLED BEFORE ADDING (RULE 1 in both directions), and the four sections taken carry real
#    text under `.content`:
#      statements  58 caps  "Address by President Serzh Sargsyan on the occasion of the 17th
#                            Anniversary of Independence"                     3,301 chars
#      press       51       "Interview of President Serzh Sargsyan to the Public TV"
#                                                                             7,322 chars
#      news       482       short presidential news items                       572 chars
#      visits     217       visit reports                                       706 chars
#    `decrees` (282 English captures) was SAMPLED AND EXCLUDED for the same reason the modern
#    /en/decrees block was: the body is ARMENIAN even under /eng/ —
#    "ՀԱՅԱՍՏԱՆԻ ՀԱՆՐԱՊԵՏՈՒԹՅԱՆ ՆԱԽԱԳԱՀԻ ՀՐԱՄԱՆԱԳԻՐԸ …" — so it would violate this recipe's
#    source_language. The existing `!original:.*/decrees/.*` filter already covers it.
#    `schedule` (135) is the president's day-view calendar and carries no `id`, so the
#    pattern's `id=\d+` requirement excludes it without needing a rule.
#
# 2. THE TITLE FIELD WAS WRITING SITE CHROME ON 57% OF ROWS — see the `title` block below.
# ─────────────────────────────────────────────────────────────────────────────────────────
source_id: arm_president_wayback
country: Armenia
source_language: English
start_urls:
  # Bare-ish prefix: the eleven sections are siblings under /en, so no single narrower
  # prefix reaches them. The CDX filter below does the narrowing server-side.
  - president.am/en
  # 2026-09-02 — THE PRE-2013 GENERATION, previously unreachable. `president.am/en` is a CDX
  # *prefix*, and the old site put the language in a path SEGMENT (/events/<section>/eng/)
  # rather than a prefix, so no widening of the pattern alone could ever have found it.
  - president.am/events
renderer: static

listing:
  # Any speech-bearing section's dated permalink. The >=5-char slug requirement (kept from
  # the original) excludes section and index captures; `^[^?]*` bars a query string.
  # Branch 1 (2013->): the modern dated permalinks. `^[^?]*` bars a query string; the
  # >=5-char slug excludes section and index captures.
  # Branch 2 (2008-2012): the old generation, where `id=<N>` ADDRESSES the article.
  # Requiring `id=\d+` is also what excludes the day-view calendar captures —
  # /events/schedule/eng/?day=20&month=09&year=2011 carries no id, so it never matches.
  link_pattern: >-
    (?:^[^?]*/en/(?:press-release|statements-and-messages|interviews-and-press-conferences|congratulatory|condolence|domestic-visits|foreign-visits|notepad|chronicle|announcements)/item/\d{4}/\d{2}/\d{2}/[^/?]{5,}/?$)|(?:/events/(?:news|statements|press|visits)/eng/\?[^#]*\bid=\d+)

pagination:
  type: wayback
  wayback_collapse: urlkey
  wayback_delay: 2.0
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
    # Two things this buys, both needed once start_urls is /en. (1) It drops the 10,329
    # `decrees` and 733 `signed-laws` captures server-side. (2) The Archive stored a
    # /favicon.ico child under thousands of article URLs (10,629 of them across the host —
    # e.g. …/item/2013/10/12/<slug>/favicon.ico); they are text/html-typed junk and the
    # mimetype filter alone does not remove them.
    - "!original:.*(/decrees/|/signed-laws/|/videos/|favicon\\.ico).*"
  # OLD GENERATION ONLY: `id` addresses the article; every parameter here is a pager or an
  # on-page toggle that varies freely across captures of the SAME document
  # (/events/visits/eng/?visits=2&pn=6&id=100 is the same page as ?id=100). Without this,
  # one speech is fetched and written many times over.
  wayback_noise_params:
    - pn
    - day
    - month
    - year
    - visits

title:
  # ⚠️ FIXED 2026-09-02 — `h1` WAS FIRST IN THIS CHAIN AND IT IS THE SITE BANNER.
  # Measured against the scraped file: 4,644 of 8,151 existing rows (57%) carry the title
  # "The President of the Republic of Armenia [the official site]", and a further 527 carry
  # the section header "Press releases - Updates - The President of the Republic of Armenia".
  # On every template on this host h1 is the banner and <title> holds the real headline
  # ("President Sarkissian handed state awards and congratulated on the occasion of Police
  # Day"), so h1 is REMOVED rather than reordered. This is exactly how a title field probes
  # GREEN while writing chrome: a matched selector is not a correct one.
  #
  # h1 IS KEPT IN THE CHAIN, because which element holds the headline VARIES BY TEMPLATE on
  # this host — measured on three real captures:
  #   /en/chronicle/item/2018/…     h1 = the headline          <title> = headline + suffix
  #   /en/press-release/item/2015/… h1 = the BANNER            <title> = headline + suffix
  #   /events/statements/eng/?id=16 h1 = absent                <title> = the BANNER
  # So neither element can be trusted alone. One regex governs the whole chain and does
  # three jobs at once (each case verified):
  #   * REJECTS a value that starts with the site name -> `regex_required` treats it as "no
  #     match", so a banner h1 falls through to <title>, and an all-banner old page ends up
  #     BLANK for the cleaner's GPT pass rather than storing chrome.
  #   * STRIPS the " - Section - Updates - The President of the Republic of Armenia [the
  #     official site]" suffix from <title> via a zero-width lookahead, since the engine
  #     returns group(0).
  #   * KEEPS a real headline that merely MENTIONS the site ("Inaugural address by the
  #     President of the Republic of Armenia his excellency Serzh Sargsyan"), because the
  #     rejection is anchored to the START, not anywhere in the string.
  selectors: ["h1", "title"]
  regex: '^(?!The President of the Republic of Armenia\b)[\s\S]+?(?=\s+-\s+[\s\S]*The President of the Republic of Armenia|\s*$)'
  regex_required: true
text:
  # `.content` is LAST on purpose: it is the OLD generation's body container (measured at
  # 3,301 chars on a 2008 statement and 7,322 on a 2008 interview) and must not shadow the
  # narrower modern containers ahead of it.
  selectors: [".news-text", ".static-content", ".news-content", "article", ".content"]
date:
  # New template ".date-cub" ("18 01, 2022") + older ".news-date" ("05.01.2015"),
  # both day-first -> date_languages: [hy].
  selectors: [".date-cub", ".news-date", "time", ".date"]
  # Every permalink on this site carries /YYYY/MM/DD/, so the URL is an exact, unambiguous
  # backstop for the captures whose mid-2018 template date the selectors miss (the original
  # notes below asked for exactly this; the engine gained it since). url_regex runs only
  # when no selector matched, so it cannot override a good on-page date.
  url_regex: '/item/(?P<year>\d{4})/(?P<month>\d{2})/(?P<day>\d{2})/'

position: president
date_languages: ["hy"]
notes: >
  Wayback recipe over president.am press releases (8,152 snapshots, 2008-2022).
  Probe-verified clean title/text/date across 2008-2022 (--n 7 --spread): older pages
  via .news-date ("05.01.2015"), newer via .date-cub ("18 01, 2022"), both day-first
  (hy). A minority of archived captures fall back to the generic text extractor or
  miss a mid-2018 template date — normal wayback noise (lands in _errors.csv). Every
  permalink carries /YYYY/MM/DD/, so a future engine "date-from-URL" feature would make
  the date rock-solid for every capture (also relevant to the Cameroon recipe).
  2026-08-10 WIDENED (gap-closing wave 2): harvest 8,152 -> 11,620 snapshots. Armenia is the
  third-largest measured audit gap (343 unmatched corpus rows, 304 of them Serzh Sargsyan
  2007-2018) even though this source had already produced 8,157 rows — the signature of a
  harvest that is deep but NARROW. press-release turned out to be one of ELEVEN article
  sections; nine speech-bearing ones are now included, of which
  statements-and-messages (698 captures) and interviews-and-press-conferences (297) are the
  two that most obviously carry the president's own words and were entirely missing. decrees
  (10,329) and signed-laws (733) stay excluded as legal instruments, and videos (379) has no
  transcript — together 45% of the host, so including them would have tripled the run for no
  usable rows. The date url_regex asked for in the paragraph above is now wired up. Re-probe
  --spread 12/12 green across both DOM templates and five sections. FULL RUN is the
  researcher's gate.
