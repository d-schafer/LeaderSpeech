# United States — Obama White House, NARA archive: PRESS BRIEFINGS.
# Sibling of usa_whitehouse_obama / _statements / _actions. Same host, same frozen Drupal
# snapshot, same selectors, same /the-press-office/ namespace; only the frozen taxonomy view
# differs (tid=36). See usa_whitehouse_obama_statements.yml for why the four views cannot be
# one recipe (the pager filename embeds the tid, and a wrong tid 404s).
#
# Podium briefings and gaggles: verbatim transcripts, frequently with the President or VP
# taking questions. Interviews/Q&A are explicitly in scope per CLAUDE.md RULE 1; where the
# speaker is only the press secretary the cleaner's speaker/leader-type gate handles it.
source_id: usa_whitehouse_obama_briefings
country: United States
source_language: English
start_urls:
  - https://obamawhitehouse.archives.gov/briefing-room/press-briefings
renderer: static

listing:
  link_selector: "a[href*='/the-press-office/']"
  link_pattern: '/the-press-office/(?:\d{4}/\d{2}/\d{2}/)?[a-z][a-z0-9-]+/?$'

pagination:
  type: path
  path_format: "index__q_term_node_tid_depth=36&page={n}.html"
  start: 1          # page 0 is the bare start_url; the frozen pager runs page=1..177
  step: 1
  max_pages: 200    # last real page measured at 177; stops early on an empty page

title:
  selectors: [".pane-node-title", "h1#page-title", "#page-title", "h1", "title"]
text:
  selectors:
    - ".field-name-field-forall-body"
    - ".pane-node-field-forall-body .forall-body"
    - ".panel-col-section-content .forall-body"
    - "article"
    - "main"
date:
  selectors: ["#press_article_date_created", ".press-article-date", ".date-display-single", "time"]

position: president
speaker_default: Barack Obama
date_languages: ["en"]
notes: >
  obamawhitehouse.archives.gov Press Briefings (~1,780 items, 177 frozen pager pages of 10).
  Written during the CHUNK A2 narrowness sweep 2026-08-11. Selectors IDENTICAL to
  usa_whitehouse_obama — same frozen snapshot, one layout. speaker_default Barack Obama is a
  FALLBACK: most briefings are the Press Secretary, and the cleaning pass assigns the real
  speaker. INCREMENTAL: shares data/state/United States.json with the other USA recipes —
  never --rescrape.
