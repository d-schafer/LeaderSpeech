# Hungary — the Government's English site kormany.hu/en, PRIME MINISTER SUBTREE ONLY,
# via the Internet Archive.
#
# WHY THIS SOURCE, AND WHY IT IS SCOPED SO TIGHTLY. Hungary's audit gap is 421 unmatched
# rows, all Viktor Orbán, concentrated in 2016-2022. Its companion recipe
# hun_miniszterelnok_english_wayback covers Orbán's personal site but the Archive only
# crawled that /en tree in quantity from 2023 — i.e. it misses precisely the gap years.
# kormany.hu/en is crawled 2011-2020 (2013: 329, 2015: 249, 2017: 628, 2019: 1,217), so
# it is the source that actually covers the window.
#
# kormany.hu is the WHOLE government — the URL names the ministry
# (/en/ministry-of-interior/news/<slug>, /en/ministry-of-foreign-affairs-and-trade/...),
# and only /en/the-prime-minister/ is the head of government. Harvesting the rest would
# repeat the zaf_gov mistake of flooding the corpus with ministerial press copy, so the
# link_pattern is pinned to the PM subtree.
#
# ⚠️ TWO QUALITY LIMITS, both measured, neither fixable from a recipe:
#  1. NO DATE ANYWHERE ON THE PAGE. Verified by regexing the raw archived HTML of
#     /en/the-prime-minister/news/zalaegerszeg-is-up-on-map-of-european-automotive-industry
#     for every date shape: the single date-like string in the document is a JavaScript
#     asset version stamp ("script.tools-2013.10.16.js"). There is no date element, no
#     meta date and no date in the body text or the URL. Rows therefore arrive dateless
#     and rely on the cleaner's date pass, with `wayback_capture` as an upper bound.
#     This is tolerable HERE specifically because Orbán has been PM continuously since
#     2010 and the whole capture window is 2011-2020, so a dateless row still resolves to
#     the right speaker via the tenure crosscheck.
#  2. THE TITLE IS A BANNER. h1 is "Website of the Hungarian Goverment" [sic] on every
#     page, <title> is the generic "Government - The Prime Minister - News", and .title
#     is a ministry+minister blob. None of them is the headline, so the title comes from
#     the URL slug via url_regex and NO title selectors are given — selectors win over
#     url_regex, so listing any of them would reinstate the banner. Same pattern as
#     pol_president_english_wayback; the cleaner polishes the dashes.
source_id: hun_kormany_english_wayback
country: Hungary
source_language: English
renderer: static

start_urls:
  # CDX prefix — no scheme, no trailing '*'. Deliberately the PM subtree, not kormany.hu/en.
  - kormany.hu/en/the-prime-minister

listing:
  # /en/the-prime-minister/news/<slug> plus the site's separate speeches section.
  # End-anchored so the ?page=N section listings are dropped.
  link_pattern: 'kormany\.hu/en/the-prime-minister/[a-z-]*(?:news|speeches)[a-z-]*/[a-z0-9][a-z0-9-]{8,}$'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  # url_regex ONLY — see limit 2 in the header. Takes the English headline slug, i.e. the
  # LAST path segment. It must not be anchored to a "/news/" or "/speeches/" parent: the
  # speeches section is actually "/the-prime-minister-s-speeches/" (with the possessive
  # -s-), so an anchored pattern silently failed on exactly the speech pages that matter
  # most — e.g. .../the-prime-minister-s-speeches/prime-minister-viktor-orban-s-speech-at-
  # the-30th-balvanyos-summer-open-university-and-student-camp.
  url_regex: '/([a-z0-9][a-z0-9-]{8,})$'
text:
  # .article-content is the article body (1,255-4,648 chars measured). Nothing wider:
  # `body` adds ~1,500 chars of identical ministry navigation to every row.
  selectors: [".article-content"]
date:
  # Intentionally empty of selectors — there is no date on these pages (see limit 1).
  # Declared with a url_regex that can never match rather than omitted, because the
  # schema requires date to carry selectors or url_regex.
  url_regex: '(?P<year>20\d{2})-(?P<month>\d{2})-(?P<day>\d{2})'

position: prime minister
speaker_default: Viktor Orbán
date_languages: ["hu"]
notes: >
  DRAFT — the 2011-2020 half of Hungary's head-of-government coverage; companion to
  hun_miniszterelnok_english_wayback, which the Archive only crawled from 2023 and which
  therefore misses the audit's 2016-2022 Orbán window. English tree -> English column, no
  translation. Scoped to the /en/the-prime-minister subtree because kormany.hu is the
  whole government (the URL names the ministry) — the same narrowing decision taken for
  zaf_gov_wayback. TWO MEASURED LIMITATIONS, both documented in the header and neither
  fixable from a recipe: the pages carry NO date of any kind (verified by regexing the raw
  archived HTML), so rows are dateless and depend on the cleaner's date pass with
  wayback_capture as an upper bound; and the title is a site banner on every page, so it
  is taken from the URL slug via url_regex with no title selectors at all. Dateless rows
  are acceptable here because Orbán has been PM for the entire 2011-2020 capture window,
  so the tenure crosscheck still resolves the speaker. FULL RUN is the researcher's gate.
