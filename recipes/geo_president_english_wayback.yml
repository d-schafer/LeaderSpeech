# Georgia — President of Georgia (president.gov.ge), the OLD English press scheme, via the Internet
# Archive. The live site is geo-fenced (no TCP from outside Georgia) → pure-wayback. This is the
# Saakashvili/Margvelashvili-era ENGLISH "Speeches and Statements" section, distinct from the modern
# geo_president_wayback (which covers only the 2019–2023 /en/News/Article scheme — and whose body is in
# fact GEORGIAN, a separate data-quality issue flagged to the researcher, 2026-07-26).
#
# Scheme: /en/PressOffice/News/SpeechesAndStatements?p=<id>&i=<n>. CDX ≈ 875 statuscode:200 captures
# spanning 2011–2015 (Saakashvili to Nov 2013, then Margvelashvili).
source_id: geo_president_english_wayback
country: Georgia
source_language: English
renderer: static
start_urls:
  # CDX prefix — engine prefix-matches, NO trailing '*'. Deliberately the PARENT path (…/News), not
  # …/SpeechesAndStatements: the individual speeches are …/SpeechesAndStatements?p=<id>, which share
  # the listing's exact PATH (differing only by query) and would be dropped by the engine's
  # listing-path filter (filter_entries_for_recipe drops URLs whose path == a start_url path, to skip
  # the index + its ?page= variants). Using the parent path keeps the articles while the tight
  # link_pattern isolates the SpeechesAndStatements?p= permalinks from the other /News sections.
  - president.gov.ge/en/PressOffice/News

# ── RULE 1 WIDENING 2026-08-13 (chunk A5) ─────────────────────────────────────────────────────
# The recipe took the section literally called SpeechesAndStatements — 1,106 of 19,701 in-scope
# captures on the host = 5.6%. president.gov.ge addresses every PressOffice article by a GLOBAL
# ?p=<id>, reachable under a section path or under the bare /en/PressOffice/News root, so the
# breadth question is "which ids do we reach", not "which URLs". Counted from the CDX enumeration:
#
#   distinct ENGLISH ?p= ids, by section path
#     /Releases              1,501      /SpeechesAndStatements   489
#     /MeetingsAndVisits       189      /Briefings                60
#     /Interviews               19      /Initiatives               2
#     bare /en/PressOffice/News root  1,619
#   union of all forms       2,260      <- every English article the Archive holds
#
#   sections only  2,243 ids = 99.2% of the union, from 2,824 URLs
#   root only      1,619 ids = 71.6% of the union, from 1,726 URLs
#   both           2,260 ids           from 4,550 URLs (2,290 redundant fetches)
#
# So the SECTION forms are taken and the bare root form is deliberately EXCLUDED: it costs 17
# articles and saves ~1,726 duplicate fetches and rows, because page_identity keeps the path, so
# /en/PressOffice/News?p=X and /en/PressOffice/News/Releases?p=X are two documents to the engine.
# 489 -> ~2,243 reachable articles.
#
# The section list is taken as [A-Za-z]+ rather than an alternation, per RULE 1 — the six sections
# above are what the Archive holds today and the pattern survives the site adding another.
# ?p= is REQUIRED, which excludes the ?i=1&a=<yyyymm> date-archive LISTINGS (209+163 captures).
# Out of scope, and separate recipes if ever wanted: the /ka/, /ge/, /ru/ and /ab/ language trees.
listing:
  # individual speech permalink: ...SpeechesAndStatements?p=<id>[&i=<n>] (excludes the bare listing and
  # the ?a=<id> filter captures)
  link_pattern: '/en/PressOffice/News/[A-Za-z]+/?\?(?=[^#]*\bp=\d+)'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  # the h1 elements + <title> are all nav banners ("Speeches & Statements" / "The Administration of
  # the President of Georgia"); the real speech headline is the FIRST .Title element (e.g. "The Day
  # After: President Mikheil Saakashvili on Post-Revolutionary Society").
  selectors: [".Title", "title"]
  regex: '^\s*(.+)'
text:
  # ⚠ BOTH DOCUMENTED CLAIMS BELOW WERE WRONG, and the probe proved it: the old header said the body
  # container is "unclassed → the generic (trafilatura) fallback is the workhorse" and that there is
  # "no reliable machine-readable date on the old template". On 10 --spread samples spanning
  # 2011-2015 the ENTIRE text chain and the ENTIRE date chain matched NOTHING — this recipe would
  # have written ~2,800 title-only rows.
  # It is an ASP.NET table-layout site and both fields have a dedicated container:
  #   div.Description  = the article prose (4,395 chars on the sampled 2009 Saakashvili statement)
  #   div.Date         = "9/9/2009"
  # .InsideNewsBox does not exist on these captures. Do NOT add `td` as a fallback — it joins to
  # the navigation (the element-join trap).
  selectors: [".Description", ".InsideNewsBox", "div.News", ".news-text", ".content", "article"]
date:
  # div.Date is US-style M/D/YYYY, which is why date_languages stays ["en"]. regex_required so a
  # miss fails loudly instead of storing the container whole.
  selectors: [".Date", "time", ".article-date", ".date", ".news-date"]
  regex: '\d{1,2}/\d{1,2}/\d{4}'
  regex_required: true

position: president
date_languages: ["en"]
notes: >
  DRAFT — OLD English "Speeches and Statements" scheme of Georgia's presidency via the Internet Archive
  (Saakashvili/Margvelashvili era). CDX prefix president.gov.ge/en/PressOffice/News/SpeechesAndStatements
  ≈ 875 statuscode:200 captures 2011–2015; link_pattern keeps the ?p=<id> article permalinks. Live site
  geo-fenced → pure-wayback. Distinct from the modern geo_president_wayback (/en/News/Article, 2019–2023)
  — and NOTE: that merged recipe's body extracts GEORGIAN despite source_language English (flagged to
  the researcher 2026-07-26). PROBE-VALIDATED (2026-07-26, --spread --n 6): 597 snapshots; body
  confirmed ENGLISH (19,071 Latin / 0 Georgian chars on the checked page). TITLE via the first .Title
  element (real headlines, e.g. "The President of Georgia Mikheil Saakashvili made a special
  statement…", "The President of Georgia addressed Cadets"); TEXT via the generic (trafilatura)
  fallback (4.7k–20.7k chars, nav stripped); DATE → cleaner. MOSTLY English — ~1 in 6 sampled pages is
  an untranslated Georgian article; the cleaner's per-row language detection handles those. start_urls
  is the PARENT /News path (not /SpeechesAndStatements) to dodge the engine's listing-path filter (the
  ?p= articles share the listing path). Multiple presidents (Saakashvili/Margvelashvili) → NO
  speaker_default; the cleaner's tenure crosscheck assigns the speaker. FULL RUN is the researcher's gate.
