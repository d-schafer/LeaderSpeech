# Australia — Governor-General (gg.gov.au), ARCHIVED speeches (Internet Archive).
# PURE-WAYBACK: the live site is unreachable (issue #18) — DNS resolves to an Akamai
# edge and TCP connects, but the server never responds (ReadTimeout even at 90s) for
# both the honest bot UA and a browser UA. A silent edge-level drop (geo-fence/bot
# management), so there is no live recipe to bound against and no wayback_to.
#
# THREE SPEECH GENERATIONS (2026-08-05: gens 2 and 3 added — the recipe previously
# harvested only gen 1, which is why coverage stopped at 2005):
#   1. 1996-2006  /speeches/html/speeches/<yyyy>/<yymmdd>.html      ~454 caps
#      Plain table-layout HTML, no headings, no date element. Deane / Hollingworth /
#      Jeffery. (gg.gov.au/speeches also holds pdfs/, rtf/ and textonly/ MIRRORS of
#      these same speeches — link_pattern keeps only the html/ copy so rows aren't
#      duplicated.)
#   2. 2007-2012  /speech.php/view/id/<N>[/title/<slug>]            ~795 caps
#      THE MISSING ERA. Bryce / Jeffery. Real headline in .title (h1 is the site
#      banner), delivery date in .date ("20 November 2007"), body in .content.
#   3. 2019-2026  /about-governor-general/media/<slug>              ~527 caps
#      Modern Drupal. Hurley / Mostyn. h1 is the headline, time[datetime] is ISO,
#      body in .field--name-body.
#
# ❌ CORRECTED 2026-08-10 (RULE 1 sweep, chunk A1). This header used to claim: "The
# 2013-2018 window is genuinely thin in the Archive — no speech generation was captured in
# quantity there. Not a recipe defect." THAT IS WRONG, and a full CDX enumeration of the host
# disproves it. There is a FOURTH generation:
#   4. 2013-2019  /speech/<slug>                                      ~324 caps (filtered)
#      Drupal 7. Captures by year: 2013:19, 2014:209, 2015:43, 2016:38, 2017:2, 2018:9,
#      2019:4 — i.e. concentrated in EXACTLY the window called sparse above. Bryce / Cosgrove.
#      Sampled http://www.gg.gov.au/speech/150th-melbourne-cup (cap 20140213051008): real
#      speech text, 1,496 chars.
# It is NOT harvested here, and deliberately so — it needs a title strategy this recipe cannot
# express. Verified selectors, so authoring it later is near-mechanical:
#      text  -> .field-name-body      (SINGLE dash: Drupal 7. Gen 3's .field--name-body is the
#                                      Drupal 8 double-dash class, so the two never collide.)
#      date  -> .date-display-single  ("2 November 2010"; absent on gens 1-3)
#      title -> <title> minus the " | Governor-General of the Commonwealth of Australia"
#               suffix. THIS is the blocker: gen 4's h1 is the site banner
#               ("Governor-General of the Commonwealth of Australia Speech"), and h1 must stay
#               ahead of <title> in the chain because gen 3 depends on it. There is no
#               gen-4-only headline selector — #page-title, h1.title and .node-title all miss.
#      ⚠ Do NOT simply add /speech/<slug> to the link_pattern: with the current chains gen 4
#      resolves title -> the site banner and text -> .content, which on these pages is the NAV
#      MENU (1,412 chars of "Search form Search About the Governor-General Role Patronages…").
# BANKED as a sibling recipe per the sweep's standing policy.
#
# ⚠️ AKAMAI/RECURSION JUNK. A plain CDX query for this domain returns ~32,000 captures
# of /akam/13/... (the Akamai bot-management interstitial) plus Drupal module
# recursion, which swamps the 60,000-row CDX ceiling and hides the real articles. The
# wayback_filter below drops them server-side; keep it on any manual cdx.py query.
#
# NOT harvested here: /about-governor-general/governor-generals-program/<slug>
# (~6,759 caps) — the GG's engagement DIARY. It is a separate source,
# aus_gg_program_wayback, so it can be dropped without disturbing these speeches.
source_id: aus_gg_wayback
country: Australia
source_language: English
start_urls:
  # CDX prefixes — the engine prefix-matches, so NO trailing '*'. None of these paths
  # equals an article path, so the engine's "drop captures whose path == a start_url
  # path" rule only removes the section indexes.
  - gg.gov.au/speeches/html/speeches
  - gg.gov.au/speech.php
  - gg.gov.au/about-governor-general/media
renderer: static

listing:
  # gen 1: <yyyy>/<yymmdd>.html, optionally a trailing letter for same-day extras
  #        (000827.html, 010804b.html). Excludes the /speeches/html/speeches.html
  #        index and the /media/mr*.html media releases.
  # gen 2: the numeric speech id; the /title/<slug> tail is optional (both forms are
  #        archived and resolve to the same page, so the engine's query-noise dedupe
  #        does not merge them — accepted, the run's seen_urls handles the rest).
  # gen 3: end-anchored slug, which drops the
  #        /about-governor-general/media?field_media_category_target_id=All&page=N
  #        listing captures.
  link_pattern: >-
    (?:/speeches/html/speeches/\d{4}/\d{6}[a-z]?\.html$)|(?:/speech\.php/view/id/\d+)|(?:/about-governor-general/media/[a-z0-9][a-z0-9-]+$)

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_filter:
    - "statuscode:200"
    # Akamai interstitials + Drupal module recursion — see the header.
    - "!original:.*(akam|sites/all|/modules/|/themes/|/misc/).*"

title:
  # .title FIRST: on gen 2 the h1 is the site banner ("Governor-General of the
  # Commonwealth of Australia") and .title holds the real headline. .title is absent on
  # gens 1 and 3, so they fall through — gen 3 to h1 (clean), gen 1 to <title>, which is
  # only a stamp like "SPEECH 27-08-2000" (weak, but the only thing those pages have;
  # the cleaner's GPT pass derives a better title from the body).
  selectors: [".title", "h1", "h2", "title"]
text:
  # Narrow, generation-specific containers first so a wider one can't shadow them:
  #   .field--name-body  gen 3  (4.2k-8.6k chars)
  #   .content           gen 2  (2.8k-7.0k chars)
  # gen 1 has no semantic container at all — it falls through to td/p/body and, in
  # practice, to the engine's generic (trafilatura) extractor, which is the real
  # workhorse there (~3.7k-char speech bodies).
  selectors: [".field--name-body", ".content", "#content", "td", "p", "body"]
date:
  # Selectors are tried first and url_regex is the fallback, which is exactly the split
  # we need: gens 2 and 3 carry a real date element, gen 1 carries none and takes the
  # date from its URL.
  #   time[datetime]           gen 3 -> 2021-04-24T12:00:00Z
  #   .field--name-field-date  gen 3 -> "24 April 2021"
  #   .date                    gen 2 -> "20 November 2007", "4 October 2009"
  # gen 1 url_regex: /speeches/2000/000827.html — the DIRECTORY holds the 4-digit year
  # and the FILENAME is yymmdd, so named groups assemble an unambiguous ISO date from
  # the directory year rather than the filename's 2-digit yy. A `selectors: ["body"]` +
  # regex fallback was tried for gen 1 and DID parse all samples correctly, but is
  # dropped on purpose: a body regex takes the FIRST date-looking string on the page, so
  # a speech opening by quoting another date ("on 3 March 1999 we...") would be
  # mis-stamped. url_regex cannot drift that way. Verified: 960822->1996-08-22,
  # 000813->2000-08-13, 011011->2001-10-11, 030307->2003-03-07, 040218b->2004-02-18.
  selectors: ["time[datetime]", ".field--name-field-date", ".date"]
  url_regex: '/speeches/(?P<year>\d{4})/\d{2}(?P<month>\d{2})(?P<day>\d{2})[a-z]?\.html'

position: governor-general
date_languages: ["en"]
notes: >
  Issue #18; EXTENDED 2026-08-05 from one generation to three, because the coverage audit
  showed Australia stalled at 1996-2005 while the reference corpus runs to 2023.
  Recipe-only; engine untouched. gen 1 = ~454 archived /speeches/html/ pages dated
  2000-2006 (Deane, Hollingworth, Jeffery); gen 2 = ~795 /speech.php/view/id/<N> captures
  covering the previously-missing 2007-2012 window (Bryce), title in .title, date in
  .date, body in .content; gen 3 = ~527 /about-governor-general/media/<slug> Drupal pages
  2019-2026 (Hurley, Mostyn), h1 + time[datetime] + .field--name-body. 2013-2018 is
  genuinely sparse in the Archive. speaker_default omitted so the tenure crosscheck
  assigns the speaker across the six Governors-General. A wayback_filter now drops the
  ~32,000 /akam/ bot-management captures that otherwise swamp the CDX ceiling.
  SCOPE NOTE: the Governor-General is Australia's ceremonial head of STATE; the head of
  GOVERNMENT is now covered separately by aus_pm_wayback (pm.gov.au, 11,301 snapshots,
  1998-2026), which is where the audit's 2,533-row Australian gap actually lives.
  FULL RUN is the researcher's gate.
