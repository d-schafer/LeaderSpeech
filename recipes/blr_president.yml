# Belarus — president.gov.by (official portal of the President; Lukashenko).
# Event/speech pages are /ru/events/<slug> (a minority carry a trailing numeric id).
# The site's event sitemap is the complete index — ~14.5k /ru/events/ pages spanning
# ~1995–present — so we crawl it directly rather than paging a listing.
source_id: blr_president
country: Belarus
source_language: Russian
# start_urls is unused for sitemap pagination (kept valid for schema/consistency).
start_urls:
  - https://president.gov.by/
renderer: static

pagination:
  type: sitemap
  # Flat urlset of every event page (~38k locs across ru/en/be); link_pattern keeps
  # the Russian event detail pages. (The index sitemap.xml also pulls 8 unrelated children.)
  sitemap_urls:
    - https://president.gov.by/sitemap.event.xml

listing:
  # Any /ru/events/<slug> detail page. Do NOT require a trailing -<digits> id: only ~8%
  # of events carry one and it is not a reliable date key, so requiring \d{10} silently
  # dropped ~92% of speeches across ALL years (1995–present) — only ~1,181 of 14,476 events.
  #
  # NARROWNESS-CHECKED 2026-08-10 (RULE 1 sweep, chunk A-sitemap) — NO CHANGE NEEDED.
  # sitemap.event.xml holds 38,341 URLs and this pattern matches 14,565 = 38.0%, which LOOKS
  # like the RULE 1 shape but is not: the whole remainder is the same events in the other two
  # languages — /be/events/ 12,833 and /en/events/ 10,348 — i.e. trap #4 (wrong-language
  # twins), correctly excluded because source_language is one field per recipe.
  # The only non-/events Russian section is /ru/media/details/ (184). SAMPLED and rejected:
  # it is the site's MEDIA GALLERY (breadcrumb "Главная / Медиа"); every .detail__* body
  # selector misses so `main` wins with 394 chars of nav chrome plus a caption, and a scan of
  # the 184 slugs finds meetings and ceremonies, no obrashchenie/poslanie/vystuplenie.
  # Media galleries are out of scope by RULE 1 and the extraction agrees.
  # BANKED (not built, per the sweep's bank-it-author-later policy): blr_president_english
  # over the 10,348 /en/events/ pages — official English Lukashenko, so it would land straight
  # in the English column with no translation step. Same sitemap, same selectors, one changed
  # language segment; it needs its own recipe only because source_language is per-recipe.
  link_pattern: '/ru/events/[a-z0-9\-]+(?:\?.*)?$'

title:
  selectors: ["h1", ".detail__title", ".news-detail__title", "title"]
text:
  selectors: [".detail__content", ".detail__text", "article", "main"]
date:
  selectors: ["time[data-datetime]", ".detail__date", ".news-detail__date", "time"]
  attr: data-datetime   # ISO-8601 w/ tz, e.g. 2026-04-07T06:00:00+03:00

position: president
speaker_default: Alexander Lukashenko
date_languages: ["ru"]
notes: >
  president.gov.by. Event/speech pages live at /ru/events/<slug> (a minority carry a
  trailing -<digits> id). Crawl sitemap.event.xml directly. Dates come from
  <time data-datetime> as ISO-8601 with a +03:00 offset, parsed via the extract.py
  fromisoformat fast-path added in this PR. Probed 2026-07-06: 14,471 links; --spread
  plus a 45-URL random sample confirm title/text/date, coverage ~1995–2026.
