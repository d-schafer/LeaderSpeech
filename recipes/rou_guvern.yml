# Romania — Government of Romania / Prime Minister (gov.ro), ROMANIAN.
# Plain static HTML to the bot UA (Apache; no anti-bot, unlike presidency.ro which sits behind a
# "Verifying your browser" JS challenge). News feed /ro/stiri, paginated ?page=N (5 items/page).
# Markup is largely unclassed: article title is the first <h2> inside .page.w635, body is
# .pageDescription, and the date is an unclassed <span> "Sâmbătă, 18 Iulie 2026" — pulled with a
# regex over .page.w635 (first date-like match = the article date at the top). Feed spans PMs
# (Bolojan 2025- , and back through the site's history) -> no speaker_default, tenure crosscheck.
# This is the Government wire (broader than PM speeches); the cleaner's document_type gate filters.
source_id: rou_guvern
country: Romania
source_language: Romanian
renderer: static
start_urls:
  - https://gov.ro/ro/stiri

listing:
  link_selector: "h2 a"
  link_pattern: '/ro/stiri/[a-z0-9-]+'

politeness:
  # gov.ro rate-limits by IP and enforces it at the TLS layer: past its burst threshold the
  # server rejects the handshake outright ("EOF occurred in violation of protocol"), for the
  # whole host — homepage included, and a browser User-Agent makes no difference. The
  # 2026-08-06 run had NO politeness block, so it crawled at the engine default of zero
  # per-request delay; it sustained 1,525 fetches that way and then tripped the limit at
  # page 306, and the 25-consecutive-failure breaker aborted it.
  #
  # Measured 2026-08-08: the ban lifts after ~6 MINUTES. That is why `retries`/`backoff` are
  # raised here as much as the delay — 5 attempts at a 30s base back off 30+60+120+240 = 450s,
  # which outlasts the ban, so a URL that hits it recovers on a later attempt instead of
  # spending a consecutive-failure slot. Default 3x5s (=15s) could not: the run burned its
  # 25 slots in ~7 min, aborting at almost exactly the moment the site would have relented.
  delay_range: [2.0, 4.0]
  pause_every: 50
  pause_seconds: 30
  retries: 5
  backoff: 30

pagination:
  type: query_param
  param: page
  start: 1
  step: 1
  # 5 items/page. RAISED 2026-08-05 from 800 to 3000 because 800 was SILENTLY TRUNCATING
  # the harvest: the on-disk gov.ro link list holds exactly 4,000 URLs = 800 pages x 5,
  # i.e. the pager stopped at the cap, not at the site's floor. Exhausting max_pages is in
  # the engine's NORMAL_STOPS, so it sets no `stopped_early` flag and logs no warning — a
  # capped harvest is byte-identical to a complete one and the only way to detect it is
  # this arithmetic. Romania is a gap country in the coverage audit (184 unmatched rows,
  # 0% matched, all of them PRIME MINISTERS — Ponta, Ciucă, Dăncilă, Cîțu — i.e. gov.ro
  # rather than presidency.ro), so the truncated years are exactly the ones that matter.
  # Re-check |links| against 3000 x 5 = 15,000 after the next harvest; if it lands on
  # 15,000 again the cap is still binding.
  max_pages: 3000

title:
  selectors: [".page.w635 h2", "h2", "title"]
text:
  selectors: [".pageDescription", ".page.w635"]
date:
  selectors: [".page.w635"]
  regex: '\d{1,2}\s+\w+\s+20\d\d'

position: prime minister
date_languages: ["ro"]
notes: >
  DRAFT — probe-validated (no full run). Government of Romania / PM news via gov.ro/ro/stiri.
  Romanian; translation stage fills English. Multiple PMs in scope -> tenure crosscheck. Broad
  government wire -> cleaner's document_type gate keeps PM speeches/statements.
