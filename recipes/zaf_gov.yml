# South Africa — SA Government speeches aggregator (gov.za/news/speeches), ENGLISH.
# The deep official archive of ALL government speeches (President + ministers). Static Drupal:
# title h1; body .field--name-body; date the <time> element ("10 Jul 2026"); pager ?page=N (0-indexed).
# Article URLs /news/speeches/<slug>. This is broader than the presidency (the master's
# thepresidency.gov.za only shows the current 7th administration), so it is the depth source the
# researcher chose. No speaker_default / no position — the cleaner's speaker pass keeps the President's
# (Ramaphosa etc.) speeches and the document_type gate filters; ministers' speeches are also retained
# if useful. Covers many years back (SONA, presidential addresses + ministerial).
source_id: zaf_gov
country: South Africa
source_language: English
renderer: static
# WIDENED 2026-08-10 (RULE 1 sweep, chunk A1). The recipe took /news/speeches ONLY — one of
# gov.za's SEVEN news sections. Enumerated from the site's own nav (live triage; a CDX pass on
# gov.za/news is not usable, see the note at the foot of this header):
#     /news/speeches                        <- the only one previously taken
#     /news/media-statements                <- statements/press releases. SAMPLED: same Drupal
#                                              shape, h1 + .field--name-body (17,776 chars on
#                                              "Minister Ronald Lamola: South Africa's foreign
#                                              policy priorities…") + <time>. Selectors unchanged.
#     /news/cabinet-statements              <- Cabinet statements
#     /news/parliamentary-questions-and-answers  <- the leader's own answers to Parliament
#     /news/media-advisories                <- short notices, taken (cheap, cleaner filters)
#     /news/events                          <- NOT taken: engagement diary, the Denmark
#                                              /kalender/ shape
#     /news/state-nation-address            <- NOT taken as a section: it is a HUB page with
#                                              in-page year anchors (#2026, #2025, …), not a
#                                              listing of article URLs. The SONA texts themselves
#                                              live under /news/speeches/ and are already caught.
# Also NOT taken: /blog (opinion pieces — a different top-level path, needs its own start_url;
# sample first) and /national-budget-0 (budget-speech hub, same hub shape as SONA).
#
# INCREMENTAL: data/state/South Africa.json holds a seen-URL set, so an ordinary run fetches only
# newly-matched URLs. Do NOT --rescrape.
#
# ⚠ CONCURRENCY: South Africa's state file is shared with zaf_thepresidency_wayback,
# zaf_gov_wayback and zaf_govza_extra_wayback. Never run this at the same time as any of those
# on another machine (queue rule 2) — as of 2026-08-10 a sweep_wb_za queue is running
# zaf_thepresidency_wayback on the MSU workstation.
start_urls:
  - https://www.gov.za/news/speeches
  - https://www.gov.za/news/media-statements
  - https://www.gov.za/news/cabinet-statements
  - https://www.gov.za/news/parliamentary-questions-and-answers
  - https://www.gov.za/news/media-advisories

listing:
  # All five text-bearing news sections. The optional middle segment admits the sub-filed
  # variant seen on media-statements (…/media-statements/government-activities/<slug>).
  link_pattern: '/news/(speeches|media-statements|cabinet-statements|parliamentary-questions-and-answers|media-advisories)/(?:[a-z0-9-]+/)?[a-z0-9-]+'

pagination:
  type: query_param
  param: page
  start: 0
  step: 1
  max_pages: 800

title:
  selectors: ["h1", "title"]
text:
  selectors: [".field--name-body", ".node__content", "article"]
date:
  selectors: ["time", ".field--name-field-start-date time", ".date-display-single"]

date_languages: ["en"]
notes: >
  DRAFT — probe-validated (no full run). gov.za/news/speeches — the deep official aggregator of SA
  government speeches (President + ministers). Drupal; title h1 / body .field--name-body / date <time>
  / pager ?page= (0-indexed). No speaker_default -> the cleaner's speaker pass + document_type gate
  keep the President's (and other leaders') speeches. Chosen by the researcher as SA's depth source
  alongside zaf_thepresidency (live current admin) + zaf_thepresidency_wayback (older admins).
