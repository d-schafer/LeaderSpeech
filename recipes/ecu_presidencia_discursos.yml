# Ecuador — Presidencia de la República: the /discursos/ page, Daniel Noboa's speeches
# 2023–2026 as PDFs (the sitting government; the page grows — re-run it).
#
# One server-rendered page with year accordions and 518 PDF links (2026-09-24), named
# /wp-content/uploads/[downloads/]YYYY/MM/YYYY-MM-DD-<Title>.pdf — so the date comes off the
# file name, year first (unambiguous). The matching WordPress "discursos" posts are empty
# shells (ecu_presidencia leaves them out).
#
# Earlier governments' speech files (Correa, Moreno, Lasso and Noboa's first year) are in the
# same store but no longer listed anywhere on the site: ecu_presidencia_archivo takes them
# from a URL list. That list also holds the 2024–2025 files this page links; the per-country
# state file skips a URL already scraped, so QUEUE THIS RECIPE FIRST.
source_id: ecu_presidencia_discursos
country: Ecuador
source_language: Spanish
renderer: static
content_type: pdf

start_urls:
  - https://www.presidencia.gob.ec/discursos/

listing:
  link_pattern: '^https://www\.presidencia\.gob\.ec/wp-content/uploads/(?:downloads/)?\d{4}/\d{2}/[^/?#]+\.(?:pdf|docx?)$'

pagination:
  type: none

title: {}
text: {}
date:
  url_regex: '/(?:\d{1,3}-)?(?P<year>(?:19|20)\d{2})[-_.](?P<month>\d{2})[-_.](?P<day>\d{2})[^/]*$'

position: president
date_languages: ["es"]

notes: >
  Ecuador's presidency /discursos/ page: 518 speech PDFs 2023-2026 (Daniel Noboa), dated from
  the YYYY-MM-DD file name. Grows with the sitting government. Run before
  ecu_presidencia_archivo (overlapping 2024-2025 files are then skipped by the state file).
