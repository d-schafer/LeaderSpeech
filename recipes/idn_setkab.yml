# Indonesia — Cabinet Secretariat (setkab.go.id), the English tree.
# WordPress; article pages are setkab.go.id/en/<slug>/. SSL chain doesn't verify -> verify_ssl:false.
#
# WIDENED 2026-08-15 (RULE 1 sweep, chunk A9): ~2,220 -> ~17,050 items. The recipe was scoped to
# the WordPress category literally called "Speech Transcript" — the purest form of the RULE 1
# failure. setkab.go.id/en has exactly TWO content categories in its own nav, and the one that was
# missing is 6.7x bigger (measured off each category's WordPress /page/N/ pager, 10 items/page):
#     /en/category/speech-transcript/   last page   222  -> ~2,220 items   <- all the recipe had
#     /en/category/news/                last page 1,483  -> ~14,830 items  <- added
# The /en/ news stream is the Cabinet Secretariat's English reporting on the President (state
# visits, addresses, policy announcements); statements and press releases are IN scope per the
# 2026-08-10 ruling, and the cleaner's document_type gate removes what is not a speech.
#
# NOT an alternate-views problem, and no duplicate rows: WordPress serves every article from ONE
# flat path, /en/<slug>/, regardless of category, so a post filed under BOTH categories is the
# same URL and the engine dedupes it. This is the overlapping-sections shape that the 2026-08-12
# paginate.py fix exists for — each start_url now paginates to its own end rather than stopping
# when a page adds no globally-new link.
#
# NOTE the link_pattern already accepted news articles; only the start_url was limiting it (the
# usa_whitehouse_obama shape). /wp-json/ is NOT usable here for the RULE 1 audit — setkab puts
# Imperva/Incapsula in front of it (an HTML `bobcmn` challenge, HTTP 200 text/html), though the
# listing and article pages themselves are fine for the honest bot UA under renderer: static.
#
# INCREMENTAL: an ordinary `run` fetches only URLs not already in data/state/Indonesia.json.
# Do NOT use --rescrape.
source_id: idn_setkab
country: Indonesia
source_language: English
verify_ssl: false
start_urls:
  - https://setkab.go.id/en/category/speech-transcript/
  - https://setkab.go.id/en/category/news/
renderer: static
listing:
  link_selector: "article a"
  link_pattern: '^https?://setkab\.go\.id/en/[a-z0-9-]+/?$'
pagination:
  type: path
  path_format: "page/{n}/"
  start: 1
  step: 1
  # /en/category/news/ alone runs to page 1,483; 400 would have truncated it to ~27%.
  max_pages: 1600
title:
  selectors: ["h1.entry-title", "h1", "title"]
text:
  # .detail_text is the stable body container across the site's theme eras; older posts
  # lack .entry-content entirely (was the cause of empty text on pre-2024 pages).
  selectors: [".detail_text", ".reading_text", ".entry-content", "article"]
date:
  # WordPress ISO published time; the visible .date is Indonesian ("15 Juni 2026").
  selectors: ["meta[property='article:published_time']"]
  attr: content
position: president
notes: >
  Cabinet Secretariat English speech-transcript archive (WordPress). Listing links are
  `article a` -> setkab.go.id/en/<slug>/; /page/N/ pagination; verify_ssl:false (cert chain).
  Body via .detail_text (older posts drop .entry-content); date via the article:published_time
  meta (visible date is Indonesian). Verified 2026-07-07: 10 links/page incl. deep pages,
  title/text/date OK on 2021 (Jokowi) and 2026 (Prabowo) samples. No speaker_default — the
  cleaner assigns via the tenure key. (--spread times out only because the site is slow.)
