# Finland — the PRIME MINISTER'S government, valtioneuvosto.fi English speeches, via the
# Internet Archive. Jyrki Katainen, Juha Sipilä, Antti Rinne, Sanna Marin, Petteri Orpo.
#
# WHY THIS EXISTS — the head-of-GOVERNMENT-under-a-head-of-STATE-seed pattern again, and
# Finland has NO recipe for the government at all. All four Finnish sources we hold are
# `presidentti.fi`, the President. But 37 of Finland's 40 unmatched rows are PRIME ministers
# (Sanna Marin 22, Juha Sipilä 11, Jyrki Katainen) and the text is unmistakable —
# "Statement by Prime Minister Juha Sipilä at the 60th anniversary of Finland's membership
# to the United Nations … (Check against delivery)".
#
# Measured, the four presidency sources cannot reach them: best 8-word-shingle containment
# is 0.644 on `fin_presidentti_english_wayback` but only THREE rows clear 0.3 — those are
# the three Niinistö rows, i.e. the President. Every PM row scores ~0.0.
#
# CONFIRMED BY READING. Twelve speech-slugged captures sampled and scored against the 40
# rows: /en/-/prime-minister-katainen-s-speech-at-the-arctic-cooperation-seminar matches
# **IAC_54906 (Jyrki Katainen, 2013-12-03) at containment 0.995**. Note the date: the
# Finnish government migrated its back catalogue onto the current site, so a 2013 speech is
# served by today's CMS and one recipe covers 2013-2026.
#
# ⚠️ SCOPED TO SPEECH SLUGS, AND THAT IS A DELIBERATE, STATED NARROWING. `valtioneuvosto.fi`
# is the shared portal for the whole Finnish government: the `/en/-/` namespace holds 56,385
# archived captures and is overwhelmingly MINISTRY press releases ("Finland sends material
# assistance to help Nepal fight COVID-19", "Amendments to the Aliens Act"). A scan of 12
# unfiltered captures from it matched nothing. Restricting to slugs containing `speech`,
# `opening-remarks`, `address-by`, `statement-by` or `remarks-by` takes 241 distinct
# documents instead of ~20,000, and every one of Finland's unmatched rows is titled with one
# of those words. COVERAGE RATIO is therefore low BY DESIGN and by content, not by accident:
# a speech whose slug uses none of those words is out of reach here, and widening the
# pattern is a one-line change if a later wave wants the ministry stream.
#
# ⚠️ THE LANGUAGE IS A QUERY PARAMETER, AND IT IS NOT NOISE. 37,835 captures in this
# namespace carry `?languageId=`, and on an `/en/` path `?languageId=fi_FI` or `sv_SE`
# serves FINNISH or SWEDISH. Only the bare form and `?languageId=en_US` are taken. The
# parameter is then listed in wayback_noise_params so the en_US form collapses onto the bare
# one instead of being written twice — safe precisely because the non-English forms were
# already excluded by link_pattern, which runs first.
#
# ⚠️ TWO PATH FORMS FOR THE SAME DOCUMENT, and both are needed. Articles appear as
# `/en/-/<slug>` and as `/en/-/<id>/<slug>`; measured on the speech-slug subset, 126 slugs
# exist ONLY in the bare form, 66 ONLY under an id, and 49 in both. The engine's identity
# dedupe normalises scheme, www., port and trailing slash but NOT an extra path segment, so
# taking both means roughly 49 documents written twice. That is the right trade — a missed
# document is permanent, a duplicated one is a cleaning-stage problem.
#
# MEASURED 2026-09-11. `cdx.py valtioneuvosto.fi/en/-/` = 56,385 captures (the /en prefix
# hits the 60,000 CDX ceiling), of which 407 are bare-or-en_US speech slugs resolving to 241
# distinct documents. SIBLING NOT TAKEN: `vnk.fi/en` is the Prime Minister's Office
# sub-site, 5,540 captures on the same Liferay CMS with only 111 speech slugs, and its
# articles carry the same slugs as valtioneuvosto.fi — a different HOST, which the identity
# dedupe does not normalise, so adding it would duplicate rather than extend. Flagged here
# rather than harvested.
#
# TEMPLATE, measured on the Katainen capture:
#   h1                             n=1  "Prime Minister Katainen's speech at the Arctic
#                                        cooperation seminar" — clean
#   <title>                        n=1  the same string, no suffix
#   .journal-content-article       n=1  9,965 chars: headline, a one-line meta strip
#                                        ("Government Communications Department 3.12.2013
#                                        9.15 Speech -") and then the speech
#   .journal-content-article .date n=2  joining to "Government Communications Department
#                                        3.12.2013" — the department name and the date are
#                                        both `.date` elements, which is why a regex pulls
#                                        the date back out
#   ⚠️ bare `.date`                n=5  the article's date PLUS four sidebar "latest news"
#                                        dates ("7.3.2022 15.24 3.3.2022 15.35 …"), joined
#                                        into one unparseable string. Always scope it.
#   ⚠️ `time`, `.article-body`          NO MATCH on this CMS.
#
# ⚠️ THE DATE IS NUMERIC D.M.YYYY — "3.12.2013" is 3 December 2013, confirmed against the
# corpus row's own date (IAC_54906 = 2013-12-03). `date_languages` is therefore ["fi"], a
# day-first locale. An "en" here would read it as 12 March and be silently wrong on roughly
# 40% of rows.
# ⚠️ WIDENED + BUG-FIXED 2026-09-12 (wave 6). This recipe held 156 rows and Finland has 26
# unmatched Dean_scrape rows, 22 of them PRIME MINISTERS (Sanna Marin 13, Juha Sipilä 9) —
# i.e. this host, not presidentti.fi. The cause was a regex off-by-one plus an over-narrow
# keyword list; both are documented at `link_pattern` below.
#
# CONFIRMED BY READING — per document, against named rows. Eight captures of the newly
# reachable slugs were extracted and scored against Finland's 26 unmatched rows:
#   …/prime-minister-sanna-marin-government-address-at-the-national-veterans-day-event-on-27-april-2022
#                                                          = IAC_54798  cont 0.991
#   …/speech-delivered-by-prime-minister-sanna-marin-at-parliament-s-topical-debate-on-15-march-2022
#                                                          = IAC_54832  cont 0.993
#   …/joint-statement-on-the-60th-anniversary-of-diplomatic-relations-between-finland-and-ireland-6-february-2022
#                                                          = IAC_54901  cont 0.987
# FOUR of eight sampled captures matched (one document matched under two URL forms). These
# were found by GREPPING THE SAVED CDX LIST for the row's own title, not by an even sample —
# 13 in-window rows over 17,336 candidates predicts far less than one hit, so a broad scan
# here reads NEGATIVE and tells you nothing.
#
# ⚠️ WINDOW — WIDER THAN THE CAPTURE DATES SUGGEST, AND THAT IS THE POINT. CDX reports the
# /en/-/ namespace as 2020-2026 (56,386 captures), which looks like it cannot reach the 13
# rows dated 2015-2019. It can: Finland MIGRATED ITS BACK CATALOGUE INTO THE CURRENT CMS, so
# a 2016 speech is served from a 2021 capture of a /en/-/ URL. Verified by grepping the saved
# CDX list for the older rows' own titles — …/prime-minister-sipila-s-speech-at-the-nordic-
# investment-bank-s-40th-anniversary-seminar-in-copenhagen-2-november-2016,
# …/speech-by-prime-minister-juha-sipila-at-the-uarctic-congress-2018, the World Press
# Freedom Day remarks and the Supporting Syria conference are all present. So DO NOT read the
# capture-year histogram as a content window on this host. The one older row whose title
# returns nothing is IAC_10411 (Latin American Spectrum, Mexico City, 13.10.2016), a genuine
# absence rather than a pattern problem.
source_id: fin_valtioneuvosto_english_wayback
country: Finland
source_language: English
position: prime minister
renderer: static

start_urls:
  # The article namespace. Its own path is /en/-/ which no article equals (every article has
  # at least one more segment), so nothing is discarded as a listing.
  - valtioneuvosto.fi/en/-/

listing:
  link_selector: "a"
  # Host-anchored so the `(?:\d+/)?` alternative cannot be satisfied by some deeper path.
  # Bare form or ?languageId=en_US only — see the LANGUAGE block in the header. The slug
  # must contain a speech word; that is the content scope, stated in the header.
  # ⚠️ FIXED 2026-09-12 — THE OLD PATTERN HAD AN OFF-BY-ONE THAT SILENTLY EXCLUDED EVERY
  # SLUG THAT *STARTS* WITH A SPEECH WORD. It opened `[a-z0-9][^/?]*(?:speech|…)`, and that
  # leading `[a-z0-9]` CONSUMES the slug's first character, so the alternation could only ever
  # match a keyword appearing at position 2 or later. `…/speech-delivered-by-prime-minister-
  # sanna-marin-at-parliament-s-topical-debate-on-15-march-2022` was dropped; only the
  # possessive form `…-s-speech-…` survived. The guard is now a LOOKAHEAD, `(?=[a-z0-9])`,
  # which asserts a real slug without eating it.
  # The keyword list is also widened from five hyphenated literals to whole words. The old
  # list required `address-by` / `statement-by` / `remarks-by`, so
  # `prime-minister-sanna-marin-government-address-AT-the-national-veterans-day-event` and
  # `joint-statement-ON-the-60th-anniversary-…` both failed on the preposition alone.
  # Measured on the CDX index (56,386 captures under /en/-/):
  #     old pattern                       228 captures /   152 distinct documents
  #     bug fixed + whole-word keywords   856 captures /   532 distinct documents
  #     no keyword filter at all       29,352 captures / 17,336 distinct documents
  # ⚠️ THE LAST LINE IS THE HONEST RULE 1 NUMBER AND THIS RECIPE STILL DOES NOT TAKE IT.
  # That is a deliberate, stated narrowing, not an oversight: see the sibling
  # fin_valtioneuvosto_english_all_wayback, which takes the whole English article namespace
  # and is costed there (~17,300 fetches, ~41 h at the Archive's ~420 pages/hour/stream).
  # Run this one FIRST — the state file dedupes by page identity, so the broad sibling then
  # skips everything this recipe already holds.
  # The `?languageId=` handling is load-bearing and unchanged: en_US is the same document,
  # fi_FI and sv_SE are the FINNISH and SWEDISH renderings of an English-looking slug and
  # score 0.000 against the English corpus (measured). Only en_US is admitted.
  # ⚠️ `(?::\d+)?` NOT `(?::80)?` — see the wayback_filter note below: this host is
  # archived under valtioneuvosto.fi:443 as well as the bare form.
  link_pattern: '(?i)^https?://(?:www\.)?valtioneuvosto\.fi(?::\d+)?/en/-/{1,2}(?:\d+/)?(?=[a-z0-9])[^/?]*(?:speech|remarks|address|statement|interview|press-conference|briefing|comments-by|op-ed|column)[^/?]*(?:\?languageId=en_US)?$'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
    # `(:80)?` is load-bearing — CDX returns the port form for http-era crawls and a filter
    # without it drops every one of them.
    # `(:[0-9]+)?` NOT `(:80)?` — this host is also archived under
    # **valtioneuvosto.fi:443** (48 of 56,386 captures). The documented ":80" trap has an
    # HTTPS twin, and a `(:80)?` alternation rejects `:443` silently.
    - "original:.*valtioneuvosto\\.fi(:[0-9]+)?/.*"
  # Safe ONLY because link_pattern has already excluded ?languageId=fi_FI and sv_SE: this
  # just collapses the en_US form onto the bare one.
  wayback_noise_params:
    - languageId
    - fbclid

title:
  selectors: ["h1", "title"]
text:
  selectors: [".journal-content-article", "#main-content"]
date:
  # SCOPED — a bare `.date` matches n=5 and joins four sidebar dates onto the article's own.
  # The two elements inside .journal-content-article are the department name and the date,
  # so the regex picks the date out of the join.
  selectors: [".journal-content-article .date"]
  regex: '\d{1,2}\.\d{1,2}\.\d{4}'
  regex_required: true
# ["fi"], NOT ["en"] — the date is numeric D.M.YYYY and a day-first locale is the only safe
# reading. See the header.
date_languages: ["fi"]

notes: >
  DRAFT — probe-validated 2026-09-11, no full run (Dean_scrape unmatched wave 4, tier 3).
  Finland's FIRST government recipe: all four existing Finnish sources are presidentti.fi,
  the President, while 37 of the 40 unmatched rows are PRIME ministers (Marin 22, Sipilä 11,
  Katainen). Measured, the presidency sources reach only the three Niinistö rows — best
  containment 0.644 but just 3 rows above 0.3, and every PM row scores ~0.0. CONFIRMED BY
  READING: /en/-/prime-minister-katainen-s-speech-at-the-arctic-cooperation-seminar matches
  IAC_54906 (Katainen, 2013-12-03) at containment 0.995 — and note that a 2013 speech is
  served by today's CMS, because the government migrated its back catalogue, so one recipe
  covers 2013-2026. SCOPED TO SPEECH SLUGS on purpose: valtioneuvosto.fi is the shared
  portal for the whole Finnish government and its /en/-/ namespace is 56,385 captures of
  mostly ministry press releases (an unfiltered 12-capture scan matched nothing), so the
  pattern requires speech / opening-remarks / address-by / statement-by / remarks-by in the
  slug, which takes 241 distinct documents instead of ~20,000. THREE TRAPS written into the
  header: the language is a QUERY PARAMETER and not noise (37,835 captures carry
  ?languageId=, and fi_FI / sv_SE serve Finnish and Swedish from an /en/ path — only the
  bare form and en_US are taken, and only then is languageId listed as a noise param); the
  same document appears at /en/-/<slug> AND /en/-/<id>/<slug> with 126 slugs bare-only, 66
  id-only and 49 in both, so both forms are taken and ~49 duplicates are accepted; and a
  bare `.date` matches n=5, joining four sidebar dates onto the article's own. The date is
  numeric D.M.YYYY so date_languages is ["fi"] — an "en" would read 3.12.2013 as 12 March.
  vnk.fi/en (the PM's Office sub-site, 5,540 captures, same CMS, same slugs) is FLAGGED NOT
  HARVESTED: it is a different host, which the identity dedupe does not normalise, so it
  would duplicate rather than extend. FULL RUN is the researcher's gate.
