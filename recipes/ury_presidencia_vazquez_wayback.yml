# Uruguay — presidencia.gub.uy, March 2005 – mid 2011 (Tabaré Vázquez's first term, the start of
# José Mujica's), via the Internet Archive: the presidency's news service (speeches, news,
# communiqués).
#
# One file per item, YYYYMMDDNN.htm (date + daily sequence number):
#   _web/noticias/<yyyy>/<mm>/YYYYMMDDNN.htm   2005–10 (served as both _Web and _web — the path
#                                              is case-folded)
#   sci/noticias/<yyyy>/<mm>/YYYYMMDDNN.htm    2010–11 (Mujica; "Secretaría de Comunicación
#                                              Institucional")
# on www.presidencia.gub.uy and on archivo.presidencia.gub.uy (the presidency's copy of its old
# site, captured 2011–15), folded on the file id. CDX 2026-10-05, distinct file ids by year:
# 2005 1,823, 2006 3,267, 2007 2,934, 2008 2,593, 2009 2,306, 2010 2,615, 2011 1,148 ⇒ ~16,690.
# Monthly index pages (MM_YYYY.htm) are left out. The date is the file name's.
# Selectors: <title> is the headline on both skins; body table#AutoNumber3 (2005–10) /
# div#imprimir (2010–11, the print container).
source_id: ury_presidencia_vazquez_wayback
country: Uruguay
source_language: Spanish
renderer: static
encoding: "utf-8,windows-1252"

start_urls:
  - www.presidencia.gub.uy/_web/noticias/
  - www.presidencia.gub.uy/sci/noticias/
  - archivo.presidencia.gub.uy/_web/noticias/
  - archivo.presidencia.gub.uy/sci/noticias/

listing:
  link_pattern: '(?i)^https?://(?:www\.|archivo\.)?presidencia\.gub\.uy(?::\d+)?/(?:_web|sci)/noticias/20\d\d/\d\d/20\d{8}\.html?$'

pagination:
  type: wayback
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
  wayback_collapse: urlkey
  wayback_delay: 5.0
  wayback_identity_strip:
    - '(?i)(?<=//)(?:www\.|archivo\.)?presidencia\.gub\.uy(?::\d+)?/(?:_web|sci)/noticias/20\d\d/\d\d/(?=20\d{8}\.html?$)'

title:
  selectors: ["title"]
text:
  selectors: ["table#AutoNumber3 td[valign=top]", "div#imprimir", "body"]
date:
  url_regex: '/(?P<year>20\d\d)(?P<month>0[1-9]|1[0-2])(?P<day>0[1-9]|[12]\d|3[01])\d\d\.html?$'

position: president
date_languages: ["es"]

notes: >
  presidencia.gub.uy March 2005 - mid 2011 via the Internet Archive (Tabare Vazquez I, the start
  of Jose Mujica): speeches, news, communiques, one YYYYMMDDNN.htm file per item (_web/ and sci/
  trees, www and archivo. copies, folded on the file id; ~16,690). Date from the file name.
