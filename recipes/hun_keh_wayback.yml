source_id: hun_keh_wayback
country: Hungary
source_language: Hungarian
start_urls:
  # WIDENED 2026-08-11 (sweep A3). Was `keh.hu/beszedek/` alone — and because a wayback
  # start_url is a CDX PREFIX, that single entry made the other sections unreachable no matter
  # what the link_pattern said. All five are the same CMS and the same selectors.
  - keh.hu/beszedek/
  - keh.hu/elnoki_nyilatkozatok/
  - keh.hu/sajtokozlemenyek/
  - keh.hu/interjuk/
  - keh.hu/levelek/
renderer: static

# WAYBACK recipe for the PREDECESSOR office domain keh.hu (Köztársasági Elnöki
# Hivatal) — the President of Hungary's site BEFORE sandorpalota.hu. It is NOT a
# companion of the live sandorpalota recipe (whose own Wayback adds nothing — the
# live site already serves back to its 2022 launch floor); keh.hu is a distinct,
# now-defunct source that adds real chronological depth. The IA holds ~19,500
# keh.hu captures back to 2001; this recipe targets the clean modern speech scheme
# /beszedek/<id>-<slug> (Áder János's two terms, ~2012–2022). Archived page:
# title h2, date div.newsDate ("2012. május 10."), body p.text. Speaker is left to
# the tenure crosscheck (the id-slug era is almost all Áder, but overlaps Novák's
# 2022 start). FOLLOW-UP: the older keh.hu schemes (/beszedek.YYYYMM.html indexes +
# /beszedekYYYYMMDD_slug.html articles — Sólyom/Mádl 2000–2010) use different URL
# shapes and are not covered here.
#
# ⚠️ TWO keh.hu LEADS INVESTIGATED AND CLOSED 2026-08-05 — do not re-open them:
#
#  1. AN ENGLISH keh.hu TREE IS NOT HARVESTABLE. index2.php?fm=N&am=N&l=e&hir=N (the
#     "l=e" language flag, ~264 captures 2002–2006) looks like an English mirror but
#     every capture is a <frameset> STUB: 613–756 bytes, 27 characters of extracted
#     text, <title> "Köztársasági Elnöki Hivatal". The content lived in a frame that
#     was not archived. Sampled 5 across the range; all identical. So there is no
#     hun_keh_english_wayback to write.
#     ⚠️ AMENDED 2026-08-11 (sweep A3): that verdict is right about the 2002–2006 `l=e`
#     frameset era, but it is NOT the whole English story. The MODERN Áder-era CMS has
#     its own English sections in the same <id>-<slug> scheme this recipe now harvests:
#     keh.hu/speeches/<id>-<slug> (65 captures, e.g. 1640-Speech_by_Janos_Ader_at_the_
#     VI._World_Congress_of_the_Finno_ugric_Peoples) and keh.hu/statements_and_letters/
#     (19). ~84 captures, presumably the same #content / div.newsDate selectors as their
#     Hungarian twins. They are deliberately NOT in this recipe because source_language
#     is one field per recipe and these are English — they need a sibling
#     hun_keh_english_wayback. NOT AUTHORED: flagged with the evidence rather than built,
#     because this session was out of room to sample and probe it properly. It is small
#     but it is ENGLISH, so it would be immediately queueable.
#
#  2. keh.hu/naplo* IS THE PARLIAMENTARY RECORD, NOT PRESIDENTIAL SPEECH. The ~5,700
#     /naplo/ and /naploNN/ captures (5,503 of them from a single 2001 crawl) are the
#     Országgyűlési Napló — verbatim floor speeches by ORDINARY MPs, e.g.
#     /naplo34/085/0850084.html = "DR. TARJÁN LÁSZLÓNÉ (FKgP): Tisztelt Elnök Úr!…".
#     Harvesting it would flood the corpus with hundreds of backbenchers, the same
#     mistake the zaf_gov and svn_gov audits caught. A third /naplo/ family,
#     herczeghanita.keh.hu/naplo/<slug>, is the First Lady's blog — also not in scope.
#
# Hungary's measured audit gap (421 unmatched rows) is 100% VIKTOR ORBÁN, i.e. the head
# of GOVERNMENT, and is addressed by hun_miniszterelnok_english_wayback and
# hun_kormany_english_wayback — not by this presidential source.
listing:
  # WIDENED 2026-08-11 (sweep A3): 288 -> 629 matched captures, +341 NEW page identities,
  # 0 already covered. The recipe took `beszedek` ("speeches") and nothing else — RULE 1 in its
  # textbook form. The four siblings are the same <id>-<slug> scheme in the same CMS:
  #   elnoki_nyilatkozatok  presidential declarations
  #   sajtokozlemenyek      press releases
  #   interjuk              interviews
  #   levelek               the president's letters
  # Cross-section aliasing was CHECKED and is negligible: of 633 distinct article ids on the
  # host, only 10 appear under more than one section, and most of those are static institution
  # pages (id 1527, "A köztársasági elnöki intézményről", shows up under 13 prefixes).
  #
  # ⚠️ `&pnr=N` IS KEPT ON PURPOSE, AND IT IS THE OPPOSITE OF THE ?page= ECHO TRAP.
  # 242 of the 288 original matches carry it, which looks exactly like the Drupal pagination
  # echo that inflates other hosts — so it was tested rather than assumed. It is NOT an echo:
  # `&pnr=` PAGINATES A LONG ARTICLE. The clean URL of Áder's 2012 inaugural address to
  # Parliament (id 1516) opens "Tisztelt Ház, tisztelt…"; `&pnr=5` of the SAME id continues
  # "Tisztelt Honfitársaim! Most külön is szeretnék szólni…" — the later part of the same
  # speech. Excluding them would silently truncate every long speech on this host.
  # The cost is that a long speech arrives as SEVERAL ROWS, and only page 1 carries
  # div.newsDate (the `&pnr=` renders drop it), so continuation rows are dateless. The engine
  # has no page-stitching, so that is inherent, not fixable here — flagged for the cleaner.
  link_pattern: 'keh\.hu(?::80)?/(beszedek|levelek|sajtokozlemenyek|interjuk|elnoki_nyilatkozatok)/\d+-'

pagination:
  type: wayback
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
  wayback_collapse: urlkey
  wayback_delay: 5.0

title:
  selectors: ["h2", "title"]
text:
  selectors: ["p.text", ".text", "#content"]
date:
  selectors: ["div.newsDate", ".newsDate"]

position: president
date_languages: ["hu"]
