# Serbia — President of the Republic (predsednik.rs), the ENGLISH tree /en/, via the Internet
# Archive. predsednik.rs is native Serbian; /en/ is the official English site, so text lands directly
# in the English `text` column (no translation needed).
#
# ── RULE 1 AUDIT + WIDENING 2026-08-13 (chunk A5) ───────────────────────────────────────────────
# cdxbatch on predsednik.rs/en (--match prefix): the old pattern matched 757 of 874 in-scope
# captures = 86.6%, which is genuinely good — this host is not the RULE 1 shape. Two real gaps:
#   * /en/press-center/announcements/<slug> (30) — the fourth press-centre section, now added
#     along with the-best-from-serbia for symmetry with the live pair.
#   * /en/node/<N> (34, of which 23 carry :80) — SAMPLED AND REJECTED. They look like the 2012-13
#     Drupal permalink generation and are EMPTY SHELLS: 1,186 bytes, 84 chars of text,
#     "<title>Untitled Document", no container yields anything. Added to the pattern, probed, and
#     removed again — 34 wasted Archive fetches and 34 empty rows avoided. Sample before adding.
# Everything else missed is static: /en/documents/*, /en/contact/*, /en/general-secretariat/*,
# /en/taxonomy/term/<N>, /en/archives, plus galleries and videos (out by RULE 1).
#
# ── THE PRE-HTTPS NIKOLIĆ GENERATION IS A THIRD TEMPLATE, and it needed three selector fixes ────
# ~91 of the press-centre captures are http://…:80/en/press-center/<section>/<slug>, 2014-2018,
# Tomislav Nikolić's presidency. They are real articles on an older Drupal theme, and every field
# missed before this pass:
#   * the page's bare <h1> is the SITE BANNER ("The President of the Republic of Serbia") and the
#     ARTICLE title is <h1> INSIDE #main-content — so "#main-content h1" must come BEFORE "h1",
#     or the recipe writes the banner as the title on every one of them. (Same shape as the
#     hun_kormany_english_wayback banner-h1 finding in chunk A3.)
#   * the body is div.field.field-type-text-with-summary (1,050 chars of pure prose), with
#     #main-content (1,276, title+date+body) as the looser fallback.
#   * there is NO date ELEMENT — the date is loose text at the head of #main-content
#     ("07.03.2015 Acknowledgement of Serbia's entire academic community …"), so it is read by
#     container + regex, with regex_required: true so a miss fails loudly instead of storing the
#     whole 1,276-char container as the date.
#
# ⚠ THE HEADER'S TWO CLAIMS WERE BOTH STALE AND ARE CORRECTED:
#   1. "The srb_predsednik master source has no validated recipe yet" — srb_predsednik (Serbian)
#      exists and was widened to 7,721 links in this same pass, and srb_predsednik_english (live,
#      690 links) was authored alongside it.
#   2. "DATE TRAP: .date matched a concatenated feed block → unparseable → omitted". That was true
#      of an UNSCOPED `.date`, which picks up the sidebar "latest news" feed — the run-5 pmo.gov.sg
#      trap. The live sibling solves it by SCOPING to `.single-content .date`, which returns exactly
#      "22.04.2024. - 22:34", and that scoped selector is now first in the chain here. Re-test a
#      documented limitation rather than inheriting it.
#
# ⚠ QUEUE ORDER: run srb_predsednik_english (live) BEFORE this recipe — they share
# data/state/Serbia.json and the same /en/press-center/<section>/<slug> URLs, and the live pages
# carry a date the archived copies of the older generations do not.
source_id: srb_predsednik_english_wayback
country: Serbia
source_language: English
renderer: static
start_urls:
  # CDX prefix — engine prefix-matches, NO trailing '*'.
  - predsednik.rs/en/press-center

listing:
  # article permalinks under press-center, all four sections. Excludes the ?page= listings and the
  # /gallery captures. Path-anchored, so the :80 host-anchor bug cannot apply (cf. Latvia).
  link_pattern: '/en/press-center/(news|press-releases|announcements|the-best-from-serbia)/[a-z]'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  # "#main-content h1" MUST come before bare "h1" — on the pre-HTTPS Nikolić theme the bare h1 is
  # the site banner and the article title is the h1 inside #main-content. See the header.
  selectors: ["h1.single-title", "#main-content h1", "h1", ".news-title", ".title", "title"]
  regex: '^\s*(.+)'
text:
  # .single-content is the modern template (matches the live sibling); the field-type-text-with-summary
  # div and #main-content recover the pre-HTTPS Nikolić-era Drupal pages.
  selectors:
    - ".single-content"
    - "div.field.field-type-text-with-summary"
    - "#main-content"
    - ".news-text"
    - ".news-content"
    - "article"
    - ".content"
date:
  # SCOPED FIRST — an unscoped `.date` returns the sidebar "latest news" feed concatenated
  # ("15.06.2020. - 13:55 20:20 23.07.2024. - ..."), which is what the old header recorded as an
  # unfixable trap. Scoping to .single-content is the live sibling's fix and it works.
  # #main-content is the LAST resort for the Nikolić theme, which has no date element at all — the
  # date is the first thing in that container, so the regex picks it up; regex_required stops the
  # whole 1,276-char container being stored when it does not.
  # Format is Serbian day-first even on the English pages, hence date_languages ["sr"].
  selectors: [".single-content .date", "time[datetime]", "article .date", "time", "#main-content"]
  regex: '\d{1,2}\.\d{1,2}\.\d{4}'
  regex_required: true

position: president
# ⚠ ["sr"] IS DELIBERATE ON THE ENGLISH TREE — the dates render day-first ("22.04.2024. - 22:34"),
# so "en" would read 04.05.2024 as 5 April instead of 4 May. dateparser lets the first matching
# locale win, so ["sr","en"] is wrong too. This was ["en"] before 2026-08-13.
date_languages: ["sr"]
notes: >
  RULE 1 AUDIT + WIDENING 2026-08-13 (chunk A5): 757 -> 809 snapshots, and probe --spread --n 12
  went from 10/12 title, 9/12 text, 9/12 date to 12/12/12 ACROSS BOTH TEMPLATE GENERATIONS.
  Breadth was already good — 757 of 874 in-scope captures = 86.6% — so this is mostly a REPAIR:
  added the announcements and the-best-from-serbia sections, then fixed the pre-HTTPS Nikolić-era
  theme (~91 captures, 2014-2018), where the bare h1 is the SITE BANNER, the real title is the h1
  inside #main-content, the body is div.field.field-type-text-with-summary, and there is no date
  element at all. /en/node/<N> (34 captures) was added, probed and REMOVED: empty 1,186-byte
  "Untitled Document" shells. Two documented "facts" in the old header were re-tested and both were wrong: it said no
  live Serbian recipe was validated (srb_predsednik existed and was widened to 7,721 links in the
  same pass; srb_predsednik_english was authored alongside), and it said the date was an unfixable
  concatenated-feed trap (an UNSCOPED .date is; .single-content .date is exact). date_languages
  corrected en -> sr because the English pages keep the Serbian day-first format. Many items are
  third-person activity coverage; the cleaner's document-type gate keeps the speech /
  official_statement subset. NO speaker_default — the tenure crosscheck assigns Nikolić vs Vučić.
  Run AFTER srb_predsednik_english. NO --rescrape. FULL RUN is the researcher's gate.
