name: "New source recipe"
description: "Add a scraper recipe for one leader-speech source (a website)."
title: "[recipe] <country> — <source name>"
labels: ["recipe", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one source = one recipe in `recipes/`. Fill in what you can by inspecting the site;
        see [`docs/recipes.md`](../blob/main/docs/recipes.md) for how. Blanks are fine — a partial
        recipe that scrapes title/text/date is already useful.

        **This is a recipe-only task: add a file in `recipes/`, do not modify the engine**
        (`leaderspeech/text_scraper/*`). All per-site variation belongs in the recipe. For a **Wayback**
        source the engine already supports `pagination: wayback` — copy
        [`recipes/arg_casarosada_wayback.yml`](../blob/main/recipes/arg_casarosada_wayback.yml), point
        `start_urls` at the CDX prefix (no trailing `*`), set a tight `link_pattern`, bound it with
        `wayback_to`, and **never edit a working live recipe** (Wayback is only for the pre-live era / dead sites).

        **Working this end to end:** write the recipe, prove it with
        `python -m leaderspeech.text_scraper.probe --recipe recipes/<id>.yml --spread`, do a capped run
        (`--max-pages 1 --limit 5`), then scrape the full history; debug via
        [`docs/debugging.md`](../blob/main/docs/debugging.md). Done means: probe shows a non-zero listing
        and `✓` for `title`/`text`/`date`; the capped run has `failed_this_run` ≈ 0 and low
        `via_generic_fallback`; **date coverage reaches back as far as the site's real history** (not just
        recent weeks); and a few rows are plausible against the leader-tenure key.
  - type: input
    id: country
    attributes:
      label: Country
      description: As it appears in pycountry (e.g. "United States", "Côte d'Ivoire").
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Listing / index URL
      description: The page that links to individual speeches.
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Needs JavaScript?
      description: View source (not the rendered DOM). If the speech list is missing from raw HTML, choose "js".
      options:
        - "static (plain HTML)"
        - "js (JavaScript-rendered)"
        - "not sure"
    validations:
      required: true
  - type: dropdown
    id: pagination
    attributes:
      label: Pagination style
      options:
        - "query_param (?start= / ?page=)"
        - "path (/discursos/2)"
        - "click (next button, JS)"
        - "url_list (handful of fixed pages)"
        - "wayback (Internet Archive — pre-live history or a dead site)"
        - "none (single page)"
        - "not sure"
    validations:
      required: true
  - type: textarea
    id: selectors
    attributes:
      label: Selector notes
      description: CSS selectors you found for the link list, title, body text, date, and speaker.
      placeholder: |
        link_selector: a.panel ; link_pattern: /discursos/\d+
        title: h1.titulo
        text: div.body
        date: span.fecha (Spanish)
        speaker: span.orador
  - type: input
    id: language
    attributes:
      label: Speech language
      description: For date parsing and the originlanguage columns (e.g. Spanish, French, English).
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Date range, which leaders are covered, quirks, whether it is single-office, dead-site/Wayback, etc.
