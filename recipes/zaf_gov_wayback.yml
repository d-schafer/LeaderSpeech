# South Africa — SA Government speeches aggregator (gov.za/news/speeches), via the Internet Archive.
# English-native → English column. "yes-and" to the live zaf_gov: the Archive holds the same deep
# /news/speeches/<slug> Drupal archive (President + ministers, SONA + addresses, content back to the
# 2010s migrated into the current DB) as a frozen snapshot + any deleted articles. Distinct from
# zaf_thepresidency_wayback (the presidency's OWN old Drupal-7 site).
source_id: zaf_gov_wayback
country: South Africa
source_language: English
renderer: static
start_urls:
  - gov.za/news/speeches

listing:
  # /news/speeches/<slug> article (require a slug so the ?page=N listing can't match), NARROWED
  # 2026-07-28 to the head of state / government.
  #
  # WHY: gov.za/news/speeches is the WHOLE South African government's speech archive. Of 14,796
  # distinct archived pages, only ~17% involve a President or Deputy President — the rest are
  # ministers (40%), deputy ministers (16%), MECs (13%), premiers (6%), plus reserve-bank
  # governors, commissioners and public protectors. Scraping all of it costs ~35h of Archive
  # fetching and a GPT call per non-leader speech. gov.za mercifully names the speaker in the
  # slug, so the filter is cheap and precise: keep a slug that says president/deputy-president,
  # names a post-1994 SA president, or is a State of the Nation Address.
  #
  # The complement is NOT thrown away — it is harvested by the companion recipe
  # zaf_govza_extra_wayback.yml (12,372 links), parked in queues/deferred/ for a later run.
  # Verified against the real harvest: 2,514 kept, 12,372 deferred, ZERO overlap.
  link_pattern: '/news/speeches/(?:[a-z0-9-]*-)?(?:deputy-)?president(?:[-/?]|$)|/news/speeches/[a-z0-9-]*(?:ramaphosa|zuma|mbeki|motlanthe|mandela|de-klerk)|/news/speeches/[a-z0-9-]*state-of-the-nation|/news/speeches/[a-z0-9-]*(?:^|-)sona(?:-|$)'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  selectors: ["h1", "title"]
text:
  selectors: [".field--name-body", ".node__content", "article"]
date:
  selectors: ["time", ".field--name-field-start-date time", ".date-display-single"]

date_languages: ["en"]
notes: >
  DRAFT — Wayback companion ("yes-and") to the live zaf_gov. gov.za/news/speeches is the deep official
  aggregator of SA government speeches (President Ramaphosa etc. + ministers). Reuses the live selectors
  (title h1 / body .field--name-body / date <time>). CDX ≈ 15.7k captures; slugs carry old speech dates
  (…10-apr-2013) even though most captures are 2024–2026 re-crawls of the migrated DB. NO speaker_default
  → cleaner's speaker pass + document_type gate keep the President's (and other leaders') speeches. FULL
  RUN is the researcher's gate.
