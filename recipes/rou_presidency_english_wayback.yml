# Romania — Presidency (presidency.ro), the ENGLISH tree, via the Internet Archive. ENGLISH companion
# to the native rou_presidency_wayback (which harvests /ro/media/discursuri). Genuine English text →
# English `text` column, no translation. "yes-and" — the live presidency.ro is JS-challenge blocked.
#
# TWO English generations under the /en + /eng prefixes (CDX prefix-match catches both):
#   1. MODERN  presidency.ro/en/media/speeches/<slug>   (Iohannis-era English addresses)
#   2. OLD ASP presidency.ro/eng/discursuri/<year>/<file>.htm  (Iliescu/Constantinescu 1998–2004)
source_id: rou_presidency_english_wayback
country: Romania
source_language: English
renderer: static
start_urls:
  # CDX prefix — engine prefix-matches, NO trailing '*'. "presidency.ro/en" prefix-matches both
  # /en/… and /eng/… captures (en is a prefix of eng).
  - presidency.ro/en

listing:
  # WIDENED 2026-08-08. The previous pattern
  #     '/en/media/speeches/[^/]{8,}|/eng/discursuri/\d{4}/[^/]+\.htm'
  # matched only 75 of the 549 URLs the Archive holds under the presidency.ro/en prefix, and
  # the 474 it dropped included 168 with speech-like slugs. Three separate causes:
  #   1. `\d{4}/` cannot match the RANGE directory /eng/discursuri/2000-2001/ — which the old
  #      date comment below already knew existed. That alone cost 50 of the 108 /eng/discursuri
  #      captures.
  #   2. Whole sections were unlisted: /en/media/{messages,press-statements,press-releases},
  #      /eng/{interviuri,politica-externa,politica-intena}, and the oldest /engleza/ tree.
  #   3. Many real Iohannis addresses carry NO section segment at all — they sit at
  #      /en/media/<slug> or bare /en/<slug> (joint press statements, congratulation messages).
  # Now matches 386/549 with zero leakage from the non-speech sections (verified by diffing the
  # pattern against the full CDX list). Deliberately INCLUSIVE: **anything under /en/media/ is
  # fair game** — the first branch takes ANY /en/media/<section>/<slug>, not an enumerated
  # section list, so a section added later is picked up automatically. press-releases and the
  # politica-* communiques are kept too; the cleaner's document_type gate is the right place to
  # sift, not the harvest. All 108 real /en/media/ content pages match.
  #
  # TWO SUBTLE BUGS were caught by enumerating the dropped URLs rather than trusting the count
  # (both cost real speeches, both are why the branches look the way they do):
  #   a. The /en/<slug> exclusion list must anchor each alternative with `(/|$)`. Bare words
  #      also killed slugs that merely START with them — `president` ate 13 real pages
  #      (/en/president-of-romania-mr-klaus-iohannis-took-part-in-...) and `romania` ate 4
  #      (/en/romania-recognises-juan-guaido-...).
  #   b. The oldest /engleza/ tree cannot be keyword-matched. Its speeches are spelled the
  #      FRENCH way (discours16mar.html), or as adress23apr.html, or purely topically
  #      (nato.html, onu_sesiune.html, caspian.html, pakistan.html, usvisit.html,
  #      PapaCotroceniEngl.html). So that branch is INVERTED: take every /engleza/*.htm(l)
  #      except an explicit site-chrome list. Recovered 34 Iliescu/Constantinescu-era pages.
  #
  # Excluded by construction (never matched): presidential-administration, president/ except
  # core-documents, commitments, ajax, albumfoto, departamente, atributii, biografie, romania/,
  # search/contact/cookie-policy/accreditation-form, the /eng|/engleza site chrome (nav frames
  # stanga/dreapta/sus, imn, stema, drapel, romaniamap, ...), the section INDEX pages
  # (/en/media/speeches, /eng/discursuri/index.htm), the photo/video galleries, and a handful of
  # malformed captures the crawler recorded from unrendered JS (/en/'+value+', /en/media/press-).
  link_pattern: '(?i)/en/+media/+[a-z0-9-]+/+[^/]{8,}|/en/+media/+[a-z0-9-]{25,}|/en/president/core-documents/[^/]{8,}|/en/+(?!(?:media|president|presidential-administration|commitments|ajax|romania|search|contact|cookie-policy|accreditation-form|the)(?:/|$))[a-z0-9-]{25,}|/eng(?:leza)?/(?:discursuri|interviuri|politica-externa|politica-intena)/(?!index\.html?)|/engleza/(?!(?:main|constitutie|cronologia|fotocronica|institutiaprez|legaturi|revista_presei_engleza|presedinte|ip_aa|ip_pe|ip_pi|ip_sn)\.html?$)[a-z0-9_]+\.html?$'

keep_if:
  # The Archive stored presidency.ro's OWN "not found" page under HTTP 200 for a number of
  # captures — a ~312-char body reading "This page does not exist or is not available at this
  # time". The 2026-08-03 run wrote 6 of them into the CSV as speeches, and the widened harvest
  # would pull in more. Drop them here.
  #
  # NOTE: `block_page_patterns` is the obvious-looking knob and does NOT work for this — the
  # block-page guard lives in Fetcher.get, and a `pagination: wayback` recipe never goes through
  # it (captures are fetched by the wayback client). `keep_if` is evaluated per page after fetch,
  # explicitly including the wayback path, so it is the mechanism that applies here. Rejected
  # pages are recorded in the state file's filtered_urls and never re-fetched.
  pattern: '(?i)This page does not exist or is not available at this time'
  negate: true

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"

title:
  # modern layout: h2 is the speech title (h1 is the site banner). Old ASP /eng/discursuri pages have
  # <title>="Untitled Document" (junk) → we do NOT select <title>; those defer to the cleaner deriving
  # the title from the body (the aus_gg pattern).
  selectors: ["h2", ".news-title"]
text:
  # reuse the native recipe's containers; old ASP pages fall to the generic (trafilatura) fallback
  selectors: [".news-details", ".inner-left", ".content", "article"]
date:
  # modern .link-big-date is a crawl/JS artifact (see the native recipe) — omitted. Old ASP filenames
  # carry a 2-digit-year yymmdd (dis-030904 = 2003-09-04) and the dir year can be a range
  # (/eng/discursuri/2000-2001/) → too ambiguous for a url_regex, so DATE is deferred to the cleaner's
  # corrected-date pass (occasion/date stated in-text), mirroring the native rou_presidency_wayback.
  selectors: ["time[datetime]"]

position: president
date_languages: ["en"]
notes: >
  DRAFT — PROBE-VALIDATED (2026-07-26, --spread --n 8): 75 snapshots. MODERN /en/media/speeches/<slug>
  (Iohannis-era English addresses) → h2 title + .news-details text (e.g. his UN General Assembly
  intervention, 7,230 chars). OLD ASP /eng/discursuri/<year>/<file>.htm (Iliescu/Constantinescu
  2002–2003) → text via the engine's generic (trafilatura) fallback (5,131–17,189 chars, full
  speeches); <title>="Untitled Document" so title is left to the cleaner (aus_gg pattern). Wayback
  ENGLISH companion to Romania's presidency (yes-and to native rou_presidency_wayback; genuine English
  → English column, no translation). Multiple presidents → NO speaker_default; the cleaner's tenure
  crosscheck assigns the speaker. DATE: modern element is a crawl artifact + old ASP dates are
  ambiguous → all deferred to the cleaner + wayback_capture backstop → recipe_status partial. FULL RUN
  is the researcher's gate.
