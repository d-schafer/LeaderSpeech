# Barbados — Government Information Service (gisbarbados.gov.bb), via the Internet Archive: the
# articles whose SLUG names the Prime Minister or marks an address — the HIGH half of a
# Uruguay-style split. brb_gisbarbados_wayback takes every other article; together they are the
# whole blog (RULE 1). The live host is behind a Cloudflare challenge that even headless Chromium
# does not pass (measured 2026-08-17, outbox brb_gisbarbados).
#
# CDX 2026-10-05 (status-200 HTML, 97,798 URLs): 32,687 distinct blog/<slug> articles. The
# WordPress site (2016 →) RE-PUBLISHED the old CMS's articles with their original dates — 11 of
# 12 sampled index.php?categoryid=…&p2_articleid=N pages (2010–16) have the same title as a
# blog slug ("PM Stuart: Caribbean Open To Business!", "TWO DAYS OF FOGGING IN ST. GEORGE"), and
# the blog's article:published_time keeps 2010 — so the blog alone reaches back to ~2009 and the
# old CMS (4,477 article ids; categoryid 12 = "Speeches", 341) is left out as a duplicate.
# Captures: 2015–19 ~10,800, 2020–22 ~75,800 (the COVID years), 2023–25 ~4,600.
# THIS HALF: slugs with pm / prime-minister / mottley / stuart / freundel / thompson / arthur, or
# speech / address / remarks / statement / message / budget — 1,717 slugs (988 name the PM:
# "pm-stuart-confident-about-the-banking-sector", "prime-minister-mottley-pays-tribute-to-lord-
# radio", "statement-by-prime-minister-the-hon-david-thompson-on-the-re-assignment-of-ministerial-
# portfolios"). The speech words also bring other officials' statements and messages; the cleaner
# sorts the speakers.
# Template (2017, 2020–22 checked): h1.entry-title, .entry-content; date
# article:published_time (2022 pages carry a UTC copy first — the local one is preferred), else
# time.entry-date ("March 8, 2017").
# ?ajaxCalendar=1&mo=…&yr=… (27,056 captures) and ?id= / ?fbclid= are calendar-widget and
# tracking twins of the same article — folded.
source_id: brb_gisbarbados_pm_wayback
country: Barbados
source_language: English
renderer: static

start_urls:
  - gisbarbados.gov.bb/blog/

listing:
  link_pattern: '(?i)^https?://(?:www\.)?gisbarbados\.gov\.bb(?::\d+)?/blog/(?!(?:tag|page|category)/)(?=(?:[^/?#]*-)?(?:pm|prime-minister|primeminister|mottley|stuart|freundel|thompson|arthur|speech|speeches|address|remarks|statement|message|budget)(?:-[^/?#]*)?/?(?:\?|$))[^/?#]+/?(?:\?.*)?$'

pagination:
  type: wayback
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
  wayback_collapse: urlkey
  wayback_delay: 5.0
  wayback_noise_params: ["ajaxCalendar", "mo", "yr", "id", "_nonce"]

title:
  selectors: ["h1.entry-title"]
text:
  selectors: [".entry-content"]
date:
  selectors:
    - "meta[property='article:published_time']:not([content$='+00:00'])@content"
    - "meta[property='article:published_time']@content"
    - "time.entry-date"

position: prime minister
date_languages: ["en"]

notes: >
  Barbados GIS blog (Archive), the PM-named and address/statement slugs (1,717 of 32,687; the
  blog holds the old CMS's articles back to ~2009). HIGH half of the split with
  brb_gisbarbados_wayback. English. No speaker_default.
