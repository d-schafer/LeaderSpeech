  archives each government cycle on its own frozen subdomain and no recipe had ever targeted
  one. All 156 unmatched Hungarian rows are Viktor Orbán and NINE already-scraped Hungarian
  sources cannot reach any of them (best containment 0.204, and no row anywhere above 0.3).
  Four obvious leads were checked and all failed, and are recorded in the file header so they
  are not re-derived: miniszterelnok.hu/en is effectively 2023-onward despite 24,285
  captures; 2015-2022.kormany.hu and 2018-2022.kormany.hu have NO captures at all;
  orbanviktor.hu/en has one, from 2007; abouthungary.hu's live site is currently down ("site
  under construction") and its archived speeches section is already scraped. CONFIRMED BY
  READING: of twenty captures sampled under /the-prime-minister-s-speeches/ and scored
  against the residual, two match at containment 1.000 (IAC_61003 Orbán 2015, the 1st
