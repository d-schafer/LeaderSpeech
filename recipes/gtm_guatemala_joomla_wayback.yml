# Guatemala — guatemala.gob.gt, the Secretaría de Comunicación Social de la Presidencia portal,
# FIRST Joomla/K2 install, 2012 – Oct 2015 (Otto Pérez Molina, Alejandro Maldonado), via the
# Internet Archive. The SECOND K2 install (2015–17, /index.php/noticias/) is
# gtm_guatemala_joomla2_wayback — the two installs REUSE item ids (item 1151 is a 2012 story on
# this one and a 2016 Jimmy Morales story on the other), so they cannot share one id fold.
# The host is behind a Cloudflare interactive challenge live; see gtm_guatemala_wp_wayback
# (2018–) and gtm_guatemala_old_wayback (2004–11).
#
# This install's items are served under many alias category paths — /index.php/
# 2011-06-30-23-44-03/item/<id>-<slug> (the news), /boletines/, /agenda/, /entrevistas/,
# /discursos/, /component/k2/, nested date-stamped aliases — so every
# /index.php/…/item/<id>-<slug> URL is taken and folded to one per id (wayback_identity_strip).
# CDX 2026-09-27, status 200 HTML: captured 2012 20,760 rows, 2013 6,704, 2014 8,801, 2015 ~1,300.
# WINDOW: wayback_to 2015-11-01. Old-alias captures through 9 Oct 2015 still show this install's
# skin with the title matching the URL slug (11 sampled Jun–Oct 2015); after the switch the new
# server would answer an old alias URL with ITS item of the same number — a mislabeled article.
#
# LEFT OUT, measured:
#  * missing-child alerts (Alerta Alba-Keneth: "activada-<name>", "desactivada-<name>") —
#    excluded by slug, since they also appear under the news aliases.
#  * /informa2/ (28,431 rows, 2014–17): the transparency-law repository (Artículo 30
#    procurement, budget execution, manuals — remository downloads), not communication.
#  * /component/allvideoshare/ videos (1,275), ?start= / print / mailto echoes, itemlists.
#
# Selectors: title h2.itemTitle ("gk" skin); body .itemIntroText + .itemFullText. The pages
# print NO date: the capture date + the cleaner's dateline reading fill it (the date selector
# below matched nothing on the captures checked).
# keep_if drops items with an empty body (a 2014 "Comunicado de Prensa" item whose body is
# "jm"), so the generic extractor never writes the sidebar.
#
# PROBE 2026-09-27 (--spread 12): 6,836 snapshots (offline 6,835); title + text 11/11 kept, 1
# empty item filtered; includes a Pérez Molina speech (8,540 chars). COVERAGE: 6,835 of ~7,000
# non-alert item ids with a pre-Nov-2015 capture (~98%).
source_id: gtm_guatemala_joomla_wayback
country: Guatemala
source_language: Spanish
renderer: static

start_urls:
  - guatemala.gob.gt/index.php/

listing:
  link_pattern: '^https?://(?:www\.)?guatemala\.gob\.gt(?::\d+)?/index\.php/(?!(?:alerta-alba-keneth|noticias|comunicados|k2-component|en|world-sport|welcome|theme-showcase|videos)/)(?:[^/?#]+/){1,3}item/\d+-(?!(?:des)?activ(?:i?ad[ao]?|dad))[^/?#]+$'

pagination:
  type: wayback
  wayback_to: "20151101"
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"
  wayback_collapse: urlkey
  wayback_delay: 5.0
  wayback_identity_strip:
    # IN ORDER: every alias path between index.php/ and item/ (it can hold date stamps like
    # "2011-06-30-23-44-03" that the slug cut would otherwise fire on), then the slug.
    - '(?<=index\.php/)(?:[^/?#]+/)+(?=item/\d)'
    - '(?<=\d)-[^?#]*$'

keep_if:
  selectors: [".itemIntroText", ".itemFullText"]
  pattern: '\w{5}'

title:
  selectors: ["h2.itemTitle", "h1"]
text:
  selectors: [".itemIntroText, .itemFullText", "div.itemBody"]
date:
  selectors: ["span.itemDateCreated"]

position: president
date_languages: ["es"]

notes: >
  guatemala.gob.gt (the Presidency's Social Communication Secretariat) first Joomla/K2 install,
  2012 - Oct 2015, from the Internet Archive: Perez Molina, Maldonado. News, bulletins, agenda,
  interviews, speeches, folded by K2 id; missing-child alerts excluded. Pages carry no date.
  No speaker_default.
