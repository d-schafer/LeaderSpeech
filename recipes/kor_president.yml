# South Korea — Office of the President (president.go.kr), presidential speeches.
# The /speeches listing is a JavaScript-rendered board (a Java `.do` CMS whose
# list is fetched client-side from /ajaxf/frBoard/bbsViewGalleryList.do). The raw
# HTML carries an empty `.bbs_list` container, so renderer: js is required to get
# the `<a href="/speeches/<id>">` links. The board self-reads a `?pageNo=N` URL
# param on load, so we paginate with query_param (pageNo) rather than the awkward
# block-pager (다음/next jumps 5 pages at a time — unsafe for click harvesting).
# This board holds only the *sitting* president's speeches (Lee Jae-myung, from
# 2025-06); prior administrations are moved to separate archive sites.
#
# ⚠ BANKED, NOT BUILT — AN ENGLISH SITE EXISTS: https://en.president.go.kr/eng/index.do, linked
# from this site's own language switcher ("ENG"). It is a DIFFERENT HOST, so it needs its own
# recipe rather than a start_url here, and it would be immediately queueable under the
# English-first policy (this recipe is Korean and therefore deferred). Worth doing early in A10:
# Korea's only other English source, kor_president_moon, is a frozen archive that stops in 2022.
source_id: kor_president
country: Korea, Republic of
source_language: Korean
start_urls:
  - https://www.president.go.kr/speeches
  - https://www.president.go.kr/briefings
renderer: js

listing:
  # link_selector REMOVED 2026-08-15: "a[href*='/speeches/']" hard-coded the board and
  # silently filtered every /briefings/ link out BEFORE link_pattern ran — the widened
  # pattern alone harvested 0 briefings until this went. Same bug shape as nzl_gg and
  # kor_president_moon in this chunk: a link_selector naming one section defeats the
  # pattern that was widened to escape it.
  # WIDENED 2026-08-15 (RULE 1 sweep, chunk A9b). The recipe took the board literally called
  # 연설문 ("speeches") and left 브리핑 ("briefings") — the presidential spokesperson's briefings
  # and statements — untouched, though it is the SAME board engine and the SAME URL shape
  # (/briefings/<8-char id> beside /speeches/<8-char id>), so only the start_url excluded it.
  # Other nav entries were checked and are out or not article streams: /photos/*, /videos,
  # /card-news, /digital-goods (RULE 1), /schedule (a calendar), /resources, /policy-stories.
  # Host-anchored so a share/preview widget carrying an article URL in its query string
  # cannot match (the trap nzl_gg hit this same session).
  link_pattern: '^https?://(?:www\.)?president\.go\.kr/(?:speeches|briefings)/[A-Za-z0-9]+$'

pagination:
  type: query_param
  param: pageNo
  start: 1
  step: 1
  max_pages: 20   # 83 speeches @ 10/page => ~9 pages; 20 is a safe cap

title:
  # The subject sits in `.txtL`; the body's leading line repeats it too.
  selectors: [".txtL", "h3", "title"]
text:
  selectors: [".view_txt"]
date:
  # Dateline reads "등록일 2026.07.07." — pull the ISO-ish yyyy.mm.dd out of it.
  selectors: [".date", ".txtInfo"]
  regex: '\d{4}\.\d{2}\.\d{2}'

position: president
date_languages: ["ko"]
notes: >
  president.go.kr /speeches is a JS-rendered board (renderer: js). Its list is loaded
  from /ajaxf/frBoard/bbsViewGalleryList.do (a clean GET JSON, but the rows carry only
  a bare BBS_CD id — no URL path — so the `api` type can't build /speeches/<id>; the JS
  page assembles the anchors). Paginate via ?pageNo=N, which the SPA honors on load.
  Detail text is `.view_txt`; date is the "등록일 yyyy.mm.dd" dateline (regex). Speaker
  filled later from the leader-tenure key (current sitting president = Lee Jae-myung).
  Korean text -> source_language: Korean, routed to *_originlanguage; English section
  (en.president.go.kr) has no comparable speech archive, only press releases.
