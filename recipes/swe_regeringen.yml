# Sweden — Government Offices / Prime Minister (regeringen.se), SWEDISH.
# The ADDED head-of-government source (PM Ulf Kristersson; the master's kungahuset.se is the ceremonial
# King). The /tal/ (speeches) listing paginates only via JS (?page= is ignored), but the sitemap lists
# every speech: /sitemap.xml has 278 /tal/YYYY/MM/<slug> URLs back to 1996. Static article pages:
# title h1; date <time> ("14 oktober 2015", Swedish); body .has-wordExplanation (SiteVision content).
# regeringen.se/tal is the whole GOVERNMENT's speeches (PM + ministers), so no speaker_default / no
# position -> the cleaner's speaker pass keeps the PM's (and other leaders') and the gate filters.
# (An English mirror exists at government.se; Swedish is the fuller original.)
#
# WIDENED 2026-08-10 (RULE 1 sweep, Session A chunk A-sitemap): 271 -> 11,951 links, 0.5%
# -> 23.9% of the sitemap. The recipe took /tal/ ONLY — the textbook RULE 1 shape, and the
# most extreme ratio measured in the sweep so far. regeringen.se files ministerial and PM
# text across five article sections, all sampled, all kept:
#   pressmeddelanden 9,583  press releases (RULE 1 names these explicitly)
#   artiklar         1,812  articles — e.g. the Nordic-Baltic summit readout, 782 chars,
#                           third-person but conveys the leaders' position
#   tal                278  speeches — the only one previously taken
#   debattartiklar     189  signed op-eds by ministers in the national press (4,569 chars
#                           sampled), i.e. the leader's own words in a newspaper
#   uttalanden         107  statements — e.g. "Uttalande av statsminister Ulf Kristersson
#                           med anledning av nattens attacker mot Iran", 22 June 2025
# INCREMENTAL: the per-country state file's `seen` URL set means an ordinary `run` fetches
# only the newly-matched URLs. Do NOT --rescrape.
#
# SCALE WARNING for the researcher: this one edit adds ~11,700 pages, ~9,600 of them press
# releases from every ministry, most of which the cleaner will reject. That is RULE 1 working
# as designed ("a page wrongly harvested costs one cheap model call") but it is a real
# cleaning-cost line item, so it is called out rather than buried. Dropping `pressmeddelanden`
# from the alternation is a one-word change if the researcher prefers.
#
# WHAT STAYS OUT, each sampled:
#   * rattsliga-dokument/ (20,856) — propositions, SOU, Ds, committee directives, skrivelser,
#     international agreements. This is the "thousands of pages of clearly legal boilerplate,
#     flag it and leave it, that is a separate project" case from CLAUDE.md RULE 1. FLAGGED,
#     not taken; if it is ever wanted it needs its own recipe (most bodies are PDF attachments).
#   * kalendarium/ (3,417) — the ministers' diary. Sampled: 105 chars, "28 jan. Deltar i
#     seminarium om existentiell hälsa, Strängnäs / Deltagare Jakob Forssmed". Identical to
#     Denmark's /kalender/, which the researcher ruled out on 2026-08-10 as "not informative
#     or substantive"; that ruling is applied here.
#   * kommenterade-dagordningar/ (1,453) — EU Council agendas; .has-wordExplanation returns
#     ZERO chars (the substance is a PDF attachment).
#   * regeringsuppdrag/ (4,796), remisser/ (3,228), rapporter/ (1,385), faktapromemoria/,
#     arendeforteckningar/, informationsmaterial/, overenskommelser-och-avtal/,
#     strategier-for-internationellt-bistand/ — agency assignments and consultation
#     paperwork, no leader voice.
#
# SITEMAP SIZE CAVEAT: sitemap.xml returns exactly 50,000 <loc>s, which is the sitemaps.org
# per-file cap. robots.txt declares no other sitemap and the list runs alphabetically by
# section all the way to `uttalanden` (the last section), so it reads as complete rather than
# truncated — but if the site grows past the cap without adding a sitemap index, sections late
# in the alphabet would silently disappear. Re-measure with sitemapshapes.py before a re-run.
source_id: swe_regeringen
country: Sweden
source_language: Swedish
renderer: static
start_urls:
  - https://www.regeringen.se/tal/

pagination:
  type: sitemap
  sitemap_urls:
    - https://www.regeringen.se/sitemap.xml

listing:
  # All five text-bearing article sections, not just /tal/. Every one uses the same
  # /<section>/YYYY/MM/<slug>/ shape. `[^/]+` rather than `[a-z0-9-]+` because slugs contain
  # dots (e.g. "...h.m.-drottningen") and underscores. END-ANCHORED (`/?$`): without it the
  # probe pulled in /artiklar/2018/10/<slug>/tacksida/, a form thank-you sub-page with no
  # date. Costs exactly 1 URL of the 11,951 and keeps article sub-pages out.
  link_pattern: '/(tal|uttalanden|debattartiklar|artiklar|pressmeddelanden)/\d{4}/\d{2}/[^/]+/?$'

title:
  selectors: ["h1", "title"]
text:
  selectors: [".has-wordExplanation", ".col-1", "main"]
date:
  selectors: ["time", ".published"]
  regex: '\d{1,2}\s+\w+\s+\d{4}'

date_languages: ["sv"]
notes: >
  DRAFT — probe-validated (no full run). Sweden Government via the regeringen.se sitemap.
  WIDENED 2026-08-10 from /tal/ alone (271 links, 0.5% of the sitemap — the most extreme
  narrowness ratio measured in the sweep) to all five article sections: pressmeddelanden
  9,583 + artiklar 1,812 + tal 278 + debattartiklar 189 + uttalanden 107 = 11,951 links.
  Incremental, do NOT --rescrape. Legal documents (rattsliga-dokument, 20,856) are FLAGGED
  and left as a separate project per RULE 1; the ministers' diary (kalendarium, 3,417) is
  excluded under the researcher's Denmark /kalender/ ruling. Whole-government feed (PM +
  ministers) -> no speaker_default; the
  cleaner's speaker pass + document_type gate keep PM Kristersson's (and other leaders') speeches.
  Date from <time> (regex, date_languages sv). Swedish; translation stage fills English.
