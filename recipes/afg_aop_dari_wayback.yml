# Afghanistan — Office of the President ("Arg" / aop.gov.af), the OLD (pre-2020) site's Dari
# individual-article scheme, via the Internet Archive. The current recipe `afg_aop_wayback` covers
# only the post-2020 CMS (`/dr/news_details/<id>`), whose detail pages were first archived ~2021 —
# so it misses the Ghani-era speeches entirely. The OLD site used `aop.gov.af/dari/<id>/<slug>`, and
# the Archive holds ~750+ status-200 Dari article captures there, concentrated 2016–2017 (Ghani).
# This recovers that stratum. Live origin is unreachable/geo-fenced (issue #15) → Wayback only.
# Companion English recipe: afg_aop_english_wayback.yml. See also afg_president_gov_wayback.yml
# (the older Karzai-era president.gov.af domain).
source_id: afg_aop_dari_wayback
country: Afghanistan
source_language: Dari
start_urls:
  - aop.gov.af/dari

listing:
  # OLD-scheme individual Dari article pages: /dari/<numeric-id>[/<slug>]
  #
  # ⚠️ TIGHTENED 2026-08-11 (sweep A3): 1,626 -> 559 harvested URLs, and this is a GAIN, not a
  # scope-down. The bare `/dari/\d+` also matched the site's CATEGORY LISTINGS, which carry an
  # article id in the path and a category in the query —
  # /dari/2511/?s=dari&c=news_dr, /dari/4210?s=dari&c=reports_dr, and 200 under c=video_dr, which
  # is a video gallery and out by RULE 1 outright. They render as listings, so `article` (and
  # every other body selector) misses: the probe had text failing on 5 of 8 sampled pages and all
  # five were query variants. Left in, they would cost ~1,067 wasted Archive fetches and write
  # ~1,067 rows with a title and no body.
  # MEASURED BEFORE NARROWING, because dropping URLs is the risky direction: of the ids that
  # appear with a ?query, 153 also appear in clean form and exactly ONE does not. So the
  # exclusion loses a single article and removes about a thousand junk fetches.
  # (`(?:/[^?]*)?` keeps the /<id>/<slug> form; the `$` is what refuses the query.)
  link_pattern: '/dari/\d+(?:/[^?]*)?/?$'

pagination:
  type: wayback
  wayback_delay: 5.0
  wayback_collapse: urlkey
  wayback_filter:
    - "statuscode:200"
    - "mimetype:text/html"        # keep the harvest to HTML article pages

title:
  # the OLD CMS put the headline in the <title> (and often an h1); first line drops any " - AOP" dup
  selectors: ["h1", ".news-title", ".title", "title"]
  regex: '^\s*(.+)'
text:
  # ⚠️ FIXED 2026-08-11 (sweep A3). The comment below used to end "…so the real body comes from the
  # engine's generic (trafilatura) fallback", and it named `article` as one of the broad selectors
  # DELIBERATELY OMITTED so it "can't match a nav blob". Both parts were wrong on this theme:
  # .news-details / .news-body / .article-body / .single-news match NOTHING here (re-verified on
  # /dari/3565), so every row's body was coming from the silent generic rescue — the same defect
  # found on ken_president_wayback, which is invisible exactly when it fails. And `article` is not
  # a nav blob on this CMS: it is n=1 and 3,745 chars of headline + date + speech, scoped inside
  # div#main. The old guesses are kept ahead of it at no cost.
  selectors: [".news-details", ".news-body", ".article-body", ".single-news", "article"]
date:
  # ⚠️ FIXED 2026-08-11. The old chain matched nothing and the note concluded there is "no reliable
  # date element in the archived DOM". There is: .time / .time2 carries "یکشنبه قوس  1395,9,7" —
  # a Dari SOLAR HIJRI date, which is why it does not look like a date to a Gregorian eye.
  # NO regex is applied on purpose: the string must reach the row intact so the cleaner's
  # clean_structure_metadata/jalali.py can parse it (zodiac + Iranian month names), with the
  # wayback_capture bound and the disagreement guard behind it. The probe will report date ✗ with
  # a note that the selector matched but did not parse — that is correct and expected here, and
  # strictly better than the empty field this recipe produced before.
  selectors: [".time", ".time2", ".date", ".news-date", "time", ".published", ".post-date"]

position: president
date_languages: ["fa", "ps", "en"]
notes: >
  PROBE-VALIDATED (2026-07-24, --spread --n 8) — Wayback-only recovery of the OLD aop.gov.af Dari
  article scheme (Ghani era, ~2016–2017), which the post-2020 afg_aop_wayback recipe cannot reach.
  The probe harvested 1,626 /dari/<id> snapshots; titles extract via h1 (e.g. /dari/997 = a real
  11k-char Ghani speech 'متن سخنرانی داکتر محمد اشرف غنی…'). Coverage is PARTIAL — some ids were
  never crawled, and some /dari/<id>?s=dari&c=<cat> category pages also match (cleaner gates them
  out). TITLE from <title>/h1; TEXT via the engine's
  generic (trafilatura) fallback (custom CMS body matches no standard container); DATE has no DOM
  element → cleaner Jalali backstop + wayback_capture. No speaker_default (Office of the President;
  cleaner assigns via tenure — Ghani 2014–2021). FULL RUN is the researcher's gate.
